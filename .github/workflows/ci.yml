# CI — the gate that did not exist when a hook bug reached production.
#
# `growthx-ai-seo` is what Vercel deploys and `growthx-ai-crawler` is what
# Render deploys, so these are the checks that decide whether a commit is safe
# to land on `main`. The API's Jest suite needs no database or Redis: every
# spec runs against in-memory fakes and local fixture servers.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nothing here writes to the repository, so the token only needs to read it.
permissions:
  contents: read

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchdog:
    name: Host watchdog checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate watchdog shell syntax
        run: bash -n scripts/crawler-watchdog.sh scripts/test-crawler-watchdog.sh
      - name: Verify bounded tunnel recovery
        run: bash scripts/test-crawler-watchdog.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    # A normal run takes 3-4 minutes; this stops a hung browser or test from
    # holding a runner for GitHub's six-hour default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: growthx-ai-seo

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: growthx-ai-seo/package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces=false
        working-directory: growthx-ai-seo

      - name: Typecheck
        run: npm run typecheck

      - name: Crawl count regression test
        run: node scripts/test-crawl-page-total.cjs

      # The error-level rules are all clean, so any new one fails the build.
      # `set-state-in-effect` is pinned to `warn` in eslint.config.mjs with the
      # reason and the remaining count; everything else gates here.
      - name: Lint changed frontend files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            diff_range="origin/$BASE_REF...HEAD"
          else
            diff_range="HEAD^1...HEAD"
          fi
          changed_files=$(git diff --name-only "$diff_range" -- 'growthx-ai-seo/**/*.ts' 'growthx-ai-seo/**/*.tsx')
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files" | sed 's#^growthx-ai-seo/##' | xargs -r npx eslint
          else
            echo "No changed frontend TypeScript files to lint."
          fi

      - name: Dead code check (report legacy findings)
        run: npx knip@5
        continue-on-error: true

      # Also runs check:data, which fails the build on fabricated customer-facing figures.
      - name: Build
        run: npm run build

      # The checks above all passed on the commit that shipped a blank
      # "This page couldn't load" screen to customers: that crash only existed
      # at render time. This step loads every route in a real browser against
      # the production build, so a page that throws fails the build instead.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Route smoke test
        run: npx playwright test e2e/smoke.spec.ts

      - name: Upload smoke traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: growthx-ai-seo/test-results/
          retention-days: 7

  api:
    name: API checks
    runs-on: ubuntu-latest
    # A normal run takes 3-4 minutes; this stops a hung browser or test from
    # holding a runner for GitHub's six-hour default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: growthx-ai-crawler

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: growthx-ai-crawler/package-lock.json

      # postinstall runs `prisma generate`, which needs no database.
      - name: Install dependencies
        run: npm ci --workspaces=false
        working-directory: growthx-ai-crawler

      - name: Typecheck
        run: npx --yes --package=typescript@5.9.3 -- tsc --noEmit

      # lint:check, not lint: `npm run lint` passes --fix and would rewrite
      # files instead of failing on them.
      - name: Lint
        run: npm run lint:check

      - name: Dead code check (knip)
        run: npx knip@5

      # The fetch, render-permit and crawl-engine specs drive a real browser.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npx jest --ci

      - name: Build
        run: npm run build
