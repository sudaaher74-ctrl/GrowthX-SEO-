# Frontend CI — the gate that did not exist when a hook bug reached production.
#
# `growthx-ai-seo` is what Vercel deploys, so these are the checks that decide
# whether a commit is safe to land on `main`. Scoped to the frontend on purpose:
# the crawler has its own 112 Jest specs, but they need service dependencies
# this workflow does not stand up yet.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growthx-ai-seo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: growthx-ai-seo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The error-level rules are all clean, so any new one fails the build.
      # `set-state-in-effect` is pinned to `warn` in eslint.config.mjs with the
      # reason and the remaining count; everything else gates here.
      - name: Lint
        run: npm run lint

      # Also runs check:data, which fails the build on fabricated customer-facing figures.
      - name: Build
        run: npm run build

      # The checks above all passed on the commit that shipped a blank
      # "This page couldn't load" screen to customers: that crash only existed
      # at render time. This step loads every route in a real browser against
      # the production build, so a page that throws fails the build instead.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Route smoke test
        run: npm run test:smoke

      - name: Upload smoke traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: growthx-ai-seo/test-results/
          retention-days: 7
