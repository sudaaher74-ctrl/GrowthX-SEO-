# Compose refuses to start until every required secret is set in .env (see
# .env.example). The checks live here so the lines that use each value can
# stay plain references.
x-required-secrets: "${POSTGRES_PASSWORD:?}${ENCRYPTION_KEY:?}${JWT_SECRET:?}"

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: growthx_crawler
      POSTGRES_USER: growthx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./growthx-ai-crawler
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://growthx:${POSTGRES_PASSWORD}@postgres:5432/growthx_crawler
      - DIRECT_URL=postgresql://growthx:${POSTGRES_PASSWORD}@postgres:5432/growthx_crawler
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - PORT=3000
      - ENABLE_PLAYWRIGHT_STARTUP=false
      - PLAYWRIGHT_HEADLESS=true
      - CRAWLER_JOB_CONCURRENCY=5
      - CRAWLER_WORKER_CONCURRENCY=10
      # Required, and never committed: a key in this file is a public key.
      # Generate each with `openssl rand -hex 32` and put them in .env.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - crawler_snapshots:/app/storage/snapshots

  worker:
    build:
      context: ./growthx-ai-crawler
      dockerfile: Dockerfile
    restart: always
    # Bypass docker-entrypoint to avoid double migrations, run worker directly
    command: ["node", "dist/main-worker.js"]
    environment:
      - DATABASE_URL=postgresql://growthx:${POSTGRES_PASSWORD}@postgres:5432/growthx_crawler
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - WORKER_MODE=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      - CRAWLER_JOB_CONCURRENCY=5
      - CRAWLER_WORKER_CONCURRENCY=10
    depends_on:
      - postgres
      - redis
    volumes:
      - crawler_snapshots:/app/storage/snapshots

  frontend:
    build:
      context: ./growthx-ai-seo
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle at build time: the address a user's
        # browser uses to reach the API, not the container network name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  crawler_snapshots:
