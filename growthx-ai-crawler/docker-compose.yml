version: '3.8'

services:
  crawler-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: growthx-ai-crawler
    restart: always
    ports:
      - "3000:3000"
      - "9464:9464"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://growthx:secret123@postgres:5432/growthx_crawler?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_PROVIDER=local
      - STORAGE_PATH=/app/storage
      - ENCRYPTION_KEY=a3f89d02c1e45b67890f1234567890abcdef1234567890abcdef1234567890ab
      - PROMETHEUS_PORT=9464
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: growthx-postgres
    restart: always
    environment:
      POSTGRES_USER: growthx
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: growthx_crawler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthx -d growthx_crawler"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: growthx-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: growthx-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - crawler-api

  grafana:
    image: grafana/grafana:latest
    container_name: growthx-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  storage_data:
  grafana_data:
