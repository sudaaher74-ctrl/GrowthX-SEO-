le marketing, fan engagement, campaign analysis, and audience management. \n\nPrimary KPIs are paid subscriptions via upgrade and win back, and engagement metrics of time spent and frequency of video views. \n\nPartner closely with analytics and data science, paid media and owned promos, brand and partnerships, and product and editorial teams to prioritize highly targeted consumer messaging strategy and execution.","industry":"Agriculture","sub_industry":"Fisheries","function":"Growth","domain":[],"current":false,"attachments":[],"_id":"69b60810f154cb7acf9dbd3c"},{"company":"64eda85f2df2e0b2da9c23e4","role":"Head Of CRM","start_date":"2019-10-31T18:30:00.000Z","end_date":"2020-12-30T18:30:00.000Z","description":"LOVOO is the app for Social Entertainment, Relationships and Opposite Of Loneliness\nLOVOO has 100+ Million downloads and millions of active users. \nWhat is CRM? Customer Relationship Management\n\nUser Retention Management +  €ustomer Monetization Management \n\nI empower motivated CRM team that proactively bring things forward.\n\n✔️Expand communication reach of LOVOO towards its customers\n✔️Strategically use right channels to communicate right set of information to right set of users\n✔️Drive innovative campaigns - economically viable over short and long term - and subsequently productize successful and sustainable campaigns\n✔️Devise and execute a sustainable PLM strategy to increase the LOVOO's value towards customers\n✔️Evaluate \u0026 negotiate tools and contracts needed to ensure CRM success. \n✔️ Responsibility to ensure consistency in data-driven decision making and strategy formulation within in CRM campaigns and programs\n* Lead the department \u0026 CRM strategies and programs/campaigns and ensures that they stay aligned with the business’s overall objectives.\n\nBuilt a CRM Team from ground up\nLOVOO's DNA - #passion #teamplay  #competence #accountability #goalgetter","industry":"Agriculture","sub_industry":"Fisheries","function":"Customer Success","domain":[],"current":false,"attachments":[],"_id":"69b60810f154cb7acf9dbd3d"},{"company":"64eda85f2df2e0b2da9c23e4","role":"Senior Product Manager (CRM)","start_date":"2018-12-31T18:30:00.000Z","end_date":"2019-11-29T18:30:00.000Z","description":"I worked with awesome PM's, marketing team, engineers, designers and the brand team. I had the opportunity to impact millions of users and to add revenue through in-App Monetisation. \nFocus area: Live Video Monetization (Micropaymwnts) and Subscriptions  Revneu. \nWorked On\n1. Orchestration (segmentation, customer journeys, triggers \u0026 flows)\n2. Campaign Analytics\n3. Optimisation\n4. Experimentation\n5. Automation \u0026 LifeCycle campaigns\n6. Processes \u0026 Team\n7. Channels\n   a) Push-Notifications\n   b) In-App \n   c) Email\n\nRevenue focus areas = Subscriptions and In-App Purchases\nImpact through conversion rate optimisation, increasing ARPPU, and Payer-Share.\n\n-- Provided leadership and direction for CRM initiatives and managed day-to-day interactions with executive stakeholders and sponsors. Managed projects related to consumer engagement strategy, direct marketing operations, and consumer analytics and intelligence\n\n-- Developed the strategy and tactics to acquire, engage, retain, and thank our Disney/ABC Television consumers\n\n-- Provided CRM consulting services to internal Marketing, Product, and Sales teams with a focus on providing direct marketing campaigns, consumer-level insights, and audience profiles.\n---- Took the lead in driving personalization for consumers in all facets of marketing and product.","industry":"Agriculture","sub_industry":"Fisheries","function":"Growth","domain":[],"current":false,"attachments":[],"_id":"69b60810f154cb7acf9dbd3e"},{"company":"64eda85f2df2e0b2da9c23e4","role":"Technical Product Manager","start_date":"2018-05-31T18:30:00.000Z","end_date":"2018-12-30T18:30:00.000Z","description":"Launch LOVOO Live \nProduct Ninja \nAs Product Manager at LOVOO, I led the development of our Live Video platform, combining real-time streaming with AI moderation. Working with engineering, I defined the technical requirements and architecture needed to solve our core challenges: integrating Agora's WebRTC infrastructure while maintaining low latency and implementing effective content moderation.\nI collaborated closely with our backend team to specify the data pipelines and APIs between Agora's services and our systems. My technical background helped me partner effectively with engineering as we designed solutions including Redis caching for user profiles and an async processing system for AI moderation that preserved stream performance.\nThe architecture I helped design included:\nWebSocket protocol for real-time chat and moderation\nRedis caching for user profiles\nAsync event processing for AI content analysis\nRegional edge servers for latency optimization\n\nFramework:\nIdentify a real problem (observe existing challenges, Look for friction points in current state), Question all assumptions using first principles thinking. Find who suffers most. Do deep market research. Reach out and interview target users. Validate the problem's core pain. Brainstorm tech-driven solutions. Prototype quickly. Test with users. Iterate relentlessly.","industry":"Agriculture","sub_industry":"Fisheries","function":"Marketing","domain":[],"current":false,"attachments":[],"_id":"69b60810f154cb7acf9dbd3f"},{"company":"67f8bf1fa5a607a11c2be138","role":"Software Engineer","start_date":"2017-06-30T18:30:00.000Z","end_date":"2018-05-31T18:30:00.000Z","employment_type":"Full-time","description":"Software Engineer - Mobile Marketing Platform\n360dialog GmbH (Acquired by Censhare AG) | 2015 - 2017\n\nBuilt real-time mobile engagement infrastructure and ML-driven automation systems for enterprise clients.\n\n- Developed push notification delivery systems, in-app messaging SDKs, and event processing pipelines\n- Implemented ML algorithms for user segmentation, message timing optimization, and conversion prediction\n- Built A/B testing frameworks with statistical significance engines for campaign performance measurement\n- Engineered recommendation systems for personalized content delivery and next-best-action prediction\n- Designed and optimized backend services for real-time user lifecycle scoring and churn prediction\n- Developed data pipelines for feature extraction, model training, and real-time inference\n\nImpact: Built ML models that improved click-through rates and conversion metrics. Recruited by LOVOO for platform engineering work.\n\nStack: Python, Mobile SDKs (iOS/Android), RESTful APIs, ML libraries (scikit-learn, pandas), Real-time event processing, Database optimization,","industry":"Technology","sub_industry":"Software Development","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69e668dbd18652cbc9d85fbe"},{"company":"67f8bf1fa5a607a11c2be138","role":"Software Engineer","start_date":"2016-12-31T18:30:00.000Z","end_date":"2018-12-30T18:30:00.000Z","description":"Software Engineer - Mobile Marketing Platform\n360dialog GmbH (Acquired by Censhare AG) | 2015 - 2017\n\nBuilt real-time mobile engagement infrastructure and ML-driven automation systems for enterprise clients.\n\n- Developed push notification delivery systems, in-app messaging SDKs, and event processing pipelines\n- Implemented ML algorithms for user segmentation, message timing optimization, and conversion prediction\n- Built A/B testing frameworks with statistical significance engines for campaign performance measurement\n- Engineered recommendation systems for personalized content delivery and next-best-action prediction\n- Designed and optimized backend services for real-time user lifecycle scoring and churn prediction\n- Developed data pipelines for feature extraction, model training, and real-time inference\n\nImpact: Built ML models that improved click-through rates and conversion metrics. Recruited by LOVOO for platform engineering work.\n\nStack: Python, Mobile SDKs (iOS/Android), RESTful APIs, ML libraries (scikit-learn, pandas), Real-time event processing, Database optimization,","industry":"Technology","sub_industry":"Software Development","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69b60810f154cb7acf9dbd40"},{"company":"67f8bf1fa5a607a11c2be138","role":"Mobile Migration Manager","start_date":"2016-12-31T18:30:00.000Z","end_date":"2018-12-30T18:30:00.000Z","description":"Censhare AG acquired 360dialog.\n360dialog was a mobile marketing automation company and real-time interaction management. In that Mobile Marketing agency,  I helped clients define Customer LifeCycle and grow users \u0026 conversions.\n It has customers from multiple industries. Travel, Entertainment, E-commerce, etc. www.360dialog.com.\n\n•    Responsible for customer success \u0026 product initiatives in Mobile Marketing (Push Notifications, In-App Messaging \u0026 CRM etc). \n•    Translate customers need into successful campaigns. \nGuide campaign managers. - Define Use cases, campaigns and message.\n•    Deliver Customer Lifecycle Value Workshop \u0026 Customer Journey Mapping to clients -Share best practices, results of experiments, \u0026 use-cases. \n•    Work closely with cross-functional engineering, design, data, and campaign delivery team members. Continuously evaluate impact versus effort tradeoffs.\n•  Also helped the management prepare presentation/investment pitch-deck to sell the company to Censhare AG.\nLearning on conversion rate optimisation, increasing ARPPU, and driving Payer-Share.\n\nLOVOO was my client. They loved my work. They hired me.","industry":"Technology","sub_industry":"Software Development","function":"Marketing","domain":[],"current":false,"attachments":[],"_id":"69b60810f154cb7acf9dbd41"},{"company":"67f8ba8ca5a607a11c2b173f","role":" Business to Consumer Ecommerce (Tech Integrations)","start_date":"2016-06-30T18:30:00.000Z","end_date":"2017-02-28T18:30:00.000Z","employment_type":"","description":"Built and optimized D2C eCommerce infrastructure and marketing automation systems for Philips Hue across European markets (FR, DE, UK/I).\n\nAndroid app with real-time match statistics tracking. Selected as top 100 project from 70,000 scholarship recipients.\nAug 2016 – Jan 2017 | Philips Lighting (Signify) – B2C Ecommerce Integrations\nAPI integrations across eBay marketplace channels in US, UK, DACH, and France. Built automated inventory sync, dynamic pricing systems, and order fulfillment pipelines.\n\nStack: Python, SQL, Web scraping (BeautifulSoup/Scrapy), ETL pipelines, eBay API, Google Analytics API, Data visualization (Tableau/Power BI), Statistical analysis","industry":"Consumer Goods","sub_industry":"Appliances","function":"Marketing","domain":[],"current":false,"attachments":[],"_id":"69e668dbd18652cbc9d85fbf"},{"company":"67f8ba8ca5a607a11c2b173f","role":"Business to Consumer Ecommerce (Tech Integrations)","start_date":"2015-12-31T18:30:00.000Z","end_date":"2017-12-30T18:30:00.000Z","description":"Built and optimized D2C eCommerce infrastructure and marketing automation systems for Philips Hue across European markets (FR, DE, UK/I).\n\n- Developed pricing optimization algorithms and competitor price scraping pipelines for eBay stores\n- Built ETL data pipelines to aggregate market trends, sales data, and competitor analytics across multiple markets\n- Implemented marketing attribution models and customer journey tracking systems for multi-channel campaigns\n- Engineered A/B testing frameworks for campaign measurement across eBay and Hue Shop platforms\n- Created automated reporting dashboards for B2C sales benchmarking and KPI tracking\n- Developed recommendation engines for product cross-sell and upsell optimization\n- Built customer segmentation models using purchase history and behavior data\n\nStack: Python, SQL, Web scraping (BeautifulSoup/Scrapy), ETL pipelines, eBay API, Google Analy c use case\u003e and 2. \u003c use case\u003e). Did I miss anything?","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"I’d believe that you are interested in how MoEngage stiches data for a single customer view, and the platform uniqueness in analytics, segmentation, AI, and reporting. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"As it’s impossible to cover the entire platform in one demo, I have prepared a Pre-Demo briefing \u003chyperlink\u003e on what will we cover during the call. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Would you have time for a quick sync before our demo?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"background-color: #143A4E;","text":"4/ Post-Demo Follow-Up. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"The typical post-demo email is a stack of links, padded with pleasant comments. “Link-stacking\" puts the work back on the buyer, and it’s too product centric. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Switch it up by using your buyer’s words to fill in this framework:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[1] Contrast current vs. future process.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[2] Recap the logical approach they’re sold on.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[3] Create dramatic tension. If we do this… good. If not… bad.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[4] Share how your product delivers on the good outcome.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[5] Add a CTA based on how the email needs to “travel.”","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Here’s how it reads:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Subject: Recap, \u003c Their Company \u003e \u0026  MoEngage","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"\u003c Prospects \u003e, appreciated your time and transparent call earlier. The slides  that we walked through together are here \u003cinstert trackable link\u003e. I’d like to put emphasis on the part covering CS and Onboarding, Analytics and Segmentation. That set’s MoEngage unique. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"As you transition from your current stack to MoEngage, your team will be enabled to \u003c approach — e.g. Faster analytics, go-live with campaigns, experiment , show value\u003e.","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Ideally, this leads to \u003c good outcomes — eg: dropping campaign-flow iteration times from 30 to 7 days\u003e.  ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Here are the documents you had requested: ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Partners integration \u003c specific link to documentation \u003e.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"\u003cSpecific links\u003e","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Guessing your Prod-engineering team would be interested in knowing more about the technical architecture \u003cinstert link\u003e. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Since \u003c colleague \u003e owns \u003c project, e.g. marketing site \u003e, think we could get her input?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"background-color: #143A4E;","text":"5/ Pricing Question and Timeline ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Subject: Pricing Question and Timeline Validation","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"\u003c Prospects \u003e, Did you already have the chance to check out the collateral we shared? ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"As you asked for indicative pricing,  I am happy to provide you the same. I'd just need the following KPIs confirmed from your end:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Monthly active users (web / app / brand split would be helpful)","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Monthly email volume (Marketing / Transactional split)","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Would you be interested in Web personalization capabilities \u003cinsert link\u003e and MoEngage Inform \u003cinsert link\u003e","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"If you are looking to make the migration/integration before \u003c timing \u003e, then that would mean ideally validating MoEnage capabilities by \u003cmonth\u003e, signing by \u003c month \u003e and onboarding \u0026 integration beginning by \u003c month \u003e. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"MoEngage CS Team is highest rated for its hands-on integration support and here’s \u003c case study\u003e how a customer migrated in 3 weeks.","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":" Looking forward to your feedback on the above numbers for pricing discussion!","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"altText":"Bro Bromance GIF","caption":{"editorState":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Take a deep breath ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""}],"direction":"ltr","format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":true,"src":"https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExNTRnd2Vsa2N3M3JhZHJiN3JxdnJhdzRlaTVrZmRiem8wMmw5dnA3OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Q2aN4iiaibCus/giphy.gif","type":"image","version":1,"width":"inherit"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"background-color: #143A4E;","text":"6/ The “Forwardable” Follow-Up \u0026 Exec Alignment","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":"background-color: #143A4E;"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Most reps send emails to their champions, when they should send them through their champions. Forwardables package your message so it's easy to forward, and loop in key contacts.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"The 5 steps in this framework are:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[1] Open up with a company-wide initiative.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[2] Reference a trigger phrase that’s familiar.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[3] Stir up emotion using visual language.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[4] Create tension through a challenge.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[5] Match your ask to the decider’s job.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"Here’s how it reads:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Subject: Exec Alignment, \u003cMoEngage\u003e and \u003ccompany name\u003e","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"\u003c Prospect \u003e, thanks for sharing the numbers. I have been working internally to get you the best pricing. Infact our management wants to have an Exec Alignment as we partner together to work on this big initiative. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"The goal is to showcase the strong roadmap of MoEngage aligns with the vision on \u003ccompany name\u003e and how their measure outcomes will be achieved prioritising this integration smoothly. With the discussion so far, I have prepared a 1-pager business case that you can present to your management. Here’s the document. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Trust me \u003c company name \u003e would get the best pricing after the alignment. After the integration, your promotion is certain just like how the CPO of Soundcloud praised their Senior CRM Manager after they migrated from Braze (or their existing tool) to MoEngage \u003c https://lnkd.in/eJpaAKxW\u003e. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"We can discuss more on how we differentiate from the competitors to add more value for \u003ccompany name\u003e. The business case mentioned above is just one example of it. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Please help me get the exec-alignment on Friday or early next week. I am working internally to get to a good pricing for you. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"background-color: #143A4E;","text":"7/ Pricing Call","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" -- Most reps would send the pricing on  emails which then is circulated to competitors and value of the platform is judged based on the pricing. Instead of sharing pricing on an email, first share it on the call. If the prospect takes this call, then you know the prospect is genuinely interested. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"\u003c Prospect \u003e, I have got in the pricing for you. Its clear, transparent and significant ROI.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"I am re-sharing the 1-Page Business Case for your executive and for you to shine!","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Are you available for a call tomorrow 9:30 am or 2 pm? ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"I would also like to introduce my Sales Leader, \u003cname\u003e, in our call. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"Let’s assume they become silent after the pricing call. Here are few examples of what you can use.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"background-color: #143A4E;","text":"8/ The “Idea” Follow-Up","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Buyers don't forget you sell a product. So they don't need the reminder. Instead, try this follow-up email focused on helping buyers get their job done today. The elements in this framework are:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[1] Recall a past topic.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[2] Align it with a tool or idea.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[3] Confirm this is still a priority.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"[4] Give proof your idea is helpful.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Here’s how it reads:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Subject: Idea, \u003c Job To Be Done \u003e","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"\u003c Prospect \u003e, last we spoke, \u003c their challenge, paraphrase their words \u003e was a big focus.","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"I was just discussing \u003c content/resource/tool \u003e and thought of you.","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Are you still working on \u003c goal related to the challenge \u003e?","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"If so, check it out \u003clink\u003e.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"From what I'm seeing, I have an idea for how you could use it too.","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"If it's still relevant, let's connect.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"(there are more emails in the middle, but I will fast forward now)","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"11/ ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #826EFF;","text":"The “Account Team” Follow-Up: This one is crazy effective when executed well, and to genuinely help. Here's how to use it for high-value, late-stage deals.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #826EFF;","text":"Partner with your account team (could be a CSM, AM, or solutions engineer).","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #826EFF;","text":"Pick a few late-stage deals and detail the customer's current state.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #826EFF;","text":"Find one way you both can help the buyer today.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #826EFF;","text":"Give your team this email to send to you (the rep).","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":4},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #826EFF;","text":"Forward that email on to your buyer.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":5}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #826EFF;","text":"It's effective because:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #826EFF;","text":"I can almost guarantee no competitor is doing this.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #826EFF;","text":"It shows your buyers there's a whole team thinking about them.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #826EFF;","text":"It actually \"adds value\" by helping buyers get a job done.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #826EFF;","text":"It sets up a smooth handoff and implementation.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":4}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Here’s an example. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"Let's say you work with an operations team who doesn't have a master data hierarchy. Which throws off their segmentation and causes all kinds of issues. So you and your team modify a sample from another account and schedule a working session to refine it.","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"‍","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Subject: Meeting \u003c Prospect \u003e","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Hey \u003c Sales Rep \u003e, how's it going with \u003c Prospect \u003e? ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"I know they’re not a customer yet. But from what you shared, I can’t wait to work with them. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Think they’d be open to connecting with me next week? ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Most \u003c role, e.g. marketing \u003e teams at this stage \u003c problem, e.g. don't have a data hierarchy \u003e. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Since that's the case for them too, we can use this \u003c framework \u003e to start building theirs out.","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"It'll either make their onboarding easier, or, help them even if they don’t end up working with us.","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Think they'd be open to it?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"background-color: #143A4E;","text":"15/ The Closed-Won Feedback Email. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"At the risk of overstating it, this email can change the way you sell.   It’s fairly common to ask buyers for their ‘decision process,' and what they let you see is helpful. But it’s what you don’t see about the way your buyers buy that’s most valuable. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Here’s how to learn how your buyer's “internal sale” really goes down:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Pick a deal that closed recently. Make sure you have an open, transparent champion.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Write up the decision process you know, from what you heard and helped with.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Ask your champion to point out any gaps. What did they do that you didn’t see?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Subject: Process Feedback","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"\u003cProspect\u003e, thrilled we get to work together now. All because of what you did behind the scenes.","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"There was definitely room for me to have been a stronger partner for you along the way, too. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"So I’m wondering, open to helping me understand the work you were doing internally?","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"It'd be interesting to compare how I think you evaluated us vs. how your team actually did. ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"(e.g. the emails, conversations, docs, I never saw, but you worked so hard on.)","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Lunch on me if you’re up for it?","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"type":"horizontalrule","version":1},{"altText":"Seth Meyers Lol GIF by Late Night with Seth Meyers","caption":{"editorState":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"stay humble and keep closing deals. :D ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""}],"direction":"ltr","format":"","indent":0,"type":"root","version":1}}},"height":263,"maxWidth":750,"showCaption":true,"src":"https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExYTQxejJsdXJoZWF1MDkybzRnYW9jZHZ4Z3h6dWZjYnoyOXhkejF2NyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/RkDO1jwSjDPztB7OPU/giphy.gif","type":"image","version":1,"width":263},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"__","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"background-color: #522E2E;","text":"Activation Metric","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"For MoEngage enterprise customers, here are hypothesized activation metrics and associated tracking:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":" Hypothesized Activation Metrics","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":8,"mode":"normal","style":"","text":"Hypothesis 1: Creating and sending the first  campaign","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":8,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Reasoning: This action represents a user leveraging MoEngage's core functionality to engage customers across multiple channels. It indicates that the user has successfully onboarded, understood the platform's capabilities, and is actively using it to reach their audience. This metric directly ties to MoEngage's value proposition of enabling personalized, omnichannel customer experiences.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"Hypothesis 2: Importing and segmenting the first customer dataset","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Reasoning: Data import and segmentation are crucial first steps in utilizing a customer engagement platform effectively. This metric shows that the user is committed to using MoEngage as their primary tool for customer data management and targeting. It also indicates that the user sees value in MoEngage's analytics and segmentation capabilities, setting the stage for more advanced usage.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":8,"mode":"normal","style":"","text":"Hypothesis 3: Setting up the first AI-powered campaign optimization","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Reasoning: MoEngage emphasizes its AI capabilities for campaign optimization. When a user sets up their first AI-optimized campaign, it shows they're leveraging MoEngage's advanced features and trusting the platform to improve their marketing efforts. This action suggests a deeper level of engagement and understanding of the platform's value.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":8,"mode":"normal","style":"","text":"Hypothesis 4: Integrating MoEngage with at least one other marketing tool in their stack","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Reasoning: Integration with other tools indicates that the user is embedding MoEngage into their existing workflows and seeing it as a central part of their marketing ecosystem. This action suggests a long-term commitment to using MoEngage and recognition of its importance in their overall marketing strategy.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":8,"mode":"normal","style":"","text":"Hypothesis 5: Creating the first custom report or dashboard","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Reasoning: Custom reporting demonstrates that the user is actively using MoEngage's analytics capabilities to gain insights specific to their business needs. This action indicates that they're finding value in the data MoEngage provides and are likely to continue using the platform to drive data-informed decisions.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"background-color: #564328;","text":"Qualitative metrics: CSAT and NPS, Feedback on Quality, Reviews written on external platforms, and referral calls completed.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":1,"textStyle":"background-color: #564328;"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Onboarding Overview after closing the deal. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"altText":"Screenshot 2024-08-24 at 4.09.23 PM.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://public-cdn.growthx.club/USER/saket_toshniwal_79f1fdd9ce/EDITOR/MEDIA/250aaccd53-Screenshot_2024_08_24_at_4.09.23_PM.png","type":"image","version":1,"width":"inherit"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Step 2: Detailed Metrics Tracking","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h3"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"1. Campaign Engagement Metrics:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"   - Number of campaigns created","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"   - Types of channels used in campaigns (email, SMS, push notifications, etc.)","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"   - Campaign performance metrics (open rates, click-through rates, conversion rates)","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"   Why: These metrics show how actively and effectively users are leveraging MoEngage's core campaign functionality.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"2. Data Management Metrics:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"   - Volume of customer data imported","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"   - Number and complexity of customer segments created","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"   - Frequency of data updates/syncs","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"   Why: These metrics indicate the depth of user engagement with MoEngage's data capabilities and potential for personalized marketing.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"3. AI Utilization Metrics:","type":"text"
