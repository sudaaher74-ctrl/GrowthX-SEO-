e. You’ll see how to start with the basics, lay out your assumptions, and build a simple, logical structure to get to a workable answer. We walk through each step, from defining the problem to breaking down the numbers and validating your approach as you go.\\nThis isn’t about nailing the exact number. It’s about showing your reasoning, keeping things clear, and demonstrating that you know how to approach big, open-ended questions.\\n\\n\"},{\"attributes\":{\"bold\":true},\"insert\":\"Who this is for:\"},{\"insert\":\"\\nIf you want a practical example of how to handle market sizing in interviews, or if you freeze up when faced with “estimate X” type questions, this session gives you a real-world process you can use. Try it out, then adapt the approach to your own style and experience.\\n\\nThe answers and assumptions will change based on your understanding, knowledge and experience. However, the framework is constant and that’s the core takeaway for you from these videos.\\n\"},{\"attributes\":{\"align\":\"justify\"},\"insert\":\"\\n\"},{\"insert\":{\"image\":\"https://du2l2d5icvsbf.cloudfront.net/product_images/elevate/Estimation/estimation-template.webp\"}},{\"attributes\":{\"align\":\"justify\"},\"insert\":\"\\n\"}]}","cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/64e3bd480e8cd1d7844c419a.png","content_key_id":"70cbadc6-a96c-b717-f95f-672570fb9b1e","content_url3":"https://private-cdn.growthx.club/learning-experience-products/production/gx-elevate/what-is-the-market-size-for-air-conditioners-/what-is-the-market-size-for-air-conditioners-hls.m3u8","default_access_status":{"64e373f80e8cd1d7844c0b28":"ACTIVE","664b520b1d9da003cb114a86":"ACTIVE","664b5138ca2547c024beba47":"ACTIVE","664ad214b7b82cc132c4b223":"ACTIVE"},"tags":{"role_to_crack":["GROWTH","PRODUCT","MARKETING"],"interview_journey":["IN_TECHNICAL_ROUNDS"],"problem":["COMMUNICATION_ISSUES"]},"filters":["EL03Prep for interviews.EL02Problem solving round.EL06Es 64b52e6dc5b0499ec13a2501","updated_by":"68257ce8686567f71bff990b","__v":0,"description":"{\"ops\":[{\"attributes\":{\"bold\":true},\"insert\":\"What this session covers:\"},{\"insert\":\"\\nIn this session, we try to estimate how many trees are in Bangalore. This is a chance to take a seemingly impossible question and break it down into manageable steps. We’ll start by thinking about the city’s size and green areas, look at different types of neighborhoods, and make assumptions about tree density in each. The aim is to show how you can approach questions that seem overwhelming by staying logical and organized in your thinking.\\n\\n\"},{\"attributes\":{\"bold\":true},\"insert\":\"Who this is for:\"},{\"insert\":\"\\nIf you want to get better at making reasoned estimates for questions with little direct data, or you need to practice thinking on your feet for interviews, this session will help you develop that skill. You can use this approach for other open-ended estimation questions too.\"},{\"attributes\":{\"align\":\"justify\"},\"insert\":\"\\n\\n\\n\"},{\"insert\":{\"image\":\"https://du2l2d5icvsbf.cloudfront.net/product_images/elevate/Estimation/estimation-template.webp\"}},{\"attributes\":{\"align\":\"justify\"},\"insert\":\"\\n\"}]}","cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/64e3bb650e8cd1d7844c4077.png","content_key_id":"d04bd018-33af-0b77-a964-af48b36f24ec","content_url3":"https://private-cdn.growthx.club/learning-experience-products/production/gx-elevate/estimation-estimate-the-number-of-trees-in-bangalore/estimation-estimate-the-number-of-trees-in-bangalorehls.m3u8","default_access_status":{"64e373f80e8cd1d7844c0b28":"INACTIVE","664b520b1d9da003cb114a86":"INACTIVE","664b5138ca2547c024beba47":"INACTIVE","664ad214b7b82cc132c4b223":"INACTIVE"},"tags":{"role_to_crack":["GROWTH","PRODUCT","MARKETING"],"interview_journey":["IN_TECHNICAL_ROUNDS"],"problem":["COMMUNICATION_ISSUES"]},"filters":["EL03Prep for inte duction/resource-directory/cracking_the_code_of_appraisals_hm0i9/cracking_the_code_of_appraisals_hm0i9/authors/Omkar/4605e8b86b-Omkar.png","tagline":"GoKwik"},{"name":"Viraj","photo":"https://public-cdn.growthx.club/product_images/production/resource-directory/cracking_the_code_of_appraisals_hm0i9/cracking_the_code_of_appraisals_hm0i9/authors/Viraj/2721d57621-Viraaj_Arora.png","tagline":"Headout"}],"created_at":"2024-08-23T09:38:42.314Z","updated_at":"2026-06-12T11:16:15.842Z","__v":0,"content_key_id":"18b2e98b-9d71-99bf-be69-8e21e59bca98","default_access_status":{"66a75a16a1e042cecaa8b80f":"ACTIVE"},"active":true,"search_filters":[{"function":["All Functions"],"role":["Product Manager","Marketer","Growth operator"],"goal":["- Prepare for my performance review","- Negotiate a salary raise or promotion","- Create a professional development plan","- Have a difficult conversation with my manager"],"skill":["- Performance management\n- Negotiation\n- Career planning"],"level":"Beginner","duration":"Medium","ai_generated":"No"},{"function":"Career"}],"mux_asset_id":"LDCvUctp5ufs7XM7OuB4D75Rb9gkxJOJoy1AaZeOJ8o","mux_playback_id":"aapx8Z29EQk6YvYQSuQetbpQmqRkQLPX49P014OqhYEs"},{"_id":"66486cb7f8c5e7713ff28f6c","moduleId":"solving-behavioural-round-ft-shubham--pm-at-ninjacart","name":"Culture-fit navigation: Avoiding common pitfalls","description":"{\"ops\":[{\"attributes\":{\"bold\":true},\"insert\":\"What this session covers:\"},{\"insert\":\"\\nBehavioral interview rounds are less about what you’ve done and more about how you think, act, and relate to people on the job. Interviewers want to see your real approach to setbacks, teamwork, and tough calls. Shubham Baranawal, Product Manager at Ninjacart and GrowthX member since 2022, shares how he approaches these rounds after six years working across tech, business, and product. You’ll see how he picks the right stories from his experience, frames his responses, and makes sure his answers actually show how he works with people and solves problems.\\n\\n\"},{\"attributes\":{\"bold\":true},\"insert\":\"Who this is for:\"},{\"insert\":\"\\nIf you’re prepping for behavioral or culture-fit rounds and want to move past generic answers, this session is for you. Use Shubham’s approach as a starting point, but add your own details and voice to show interviewers who you really are.\\n\"}]}","type":"video","meta":{"functions":[]},"content_type":"url","cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/66486cb7f8c5e7713ff28f6c.png","duration":1080,"ancestry":{"64e373f80e8cd1d7844c0b28":{"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f","sequence":5},"664b520b1d9da003cb114a86":{"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f","sequence":3},"664b5138ca2547c024beba47":{"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f","sequence":3},"664ad214b7b82cc132c4b223":{"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f","sequence":6}},"created_by":"63c04327e141d74ff567c283","updated_by":"68257ce8686567f71bff990b","created_at":"2024-05-18T08:54:15.782Z","updated_at":"2026-06-12T11:22:42.528Z","__v":0,"active":true,"content_key_id":"ddb12015-3c61-9ad9-3da1-f08e4906844e","default_access_status":{"64e373f80e8cd1d7844c0b28":"ACTIVE","664b520b1d9da003cb114a86":"ACTIVE","664b5138ca2547c024beba47":"ACTIVE","664ad214b7b82cc132c4b223":"ACTIVE"},"tags":{"role_to_crack":["PRODUCT"],"interview_journey":["IN_TECHNICAL_ROUNDS"],"problem":["COMMUNICATION_ISSUES"]},"filters":["EL03Prep for interviews.EL01Interview basics.EL03Culture fit"],"mux_asset_id":"018ACkehDFEGhpjd900lGQ53weSXAafbfoK02b5jgukGLI","mux_playback_id":"oKBBZsFrbiEYtL014t0101LQmqyXkmmKplPA00hF6p5lco8"},{"_id":"6648627af8c5e7713ff24dc3","moduleId":"solving-behavioural-round-with-the-vartika-gupta-from-google-gemini","name":"Culture-fit practice: Real scenarios and responses","description":"{\"ops\":[{\"attributes\":{\"bold\":true},\"insert\":\"What this session covers:\"},{\"insert\":\"\\nBehavioral rounds are all about how you handle real-life situations and work with others. Interviewers want to know if you’ll be a good fit for the team, not just based on skills but on how you communicate, collaborate, and lead when it counts. They’re looking for specific examples from your past, and how you learned or adapted along the way. Bringing structure to your answers helps, but so does being honest about your own style and experience.\\nIn this video, Vartika Gupta, Content Strategist at Google (working on Gemini) and a GrowthX member since 2022, shares how she approaches behavioral questions. With over a decade in content, marketing, and brand, she walks through her method for preparing responses, picking the right stories, and tying everything back to what companies actually care about. \\n\\n\"},{\"attributes\":{\"bold\":true},\"insert\":\"Who this is for:\"},{\"insert\":\"\\nIf you want to approach behavioral and culture fit interviews with more confidence, this session is a great starting point. Watch how Vartika does it, then use her tips to shape your own stories and show why you belong on the team.\\n\"}]}","type":"video","meta":{"functions":[]},"content_type":"url","cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/6648627af8c5e7713ff24dc3.png","duration":450,"ancestry":{"64e373f80e8cd1d7844c0b28":{"sequence":2,"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f"},"664b520b1d9da003cb114a86":{"sequence":2,"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f"},"664b5138ca2547c024beba47":{"sequence":2,"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f"},"664ad214b7b82cc132c4b223":{"sequence":2,"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f"}},"created_by":"63c04327e141d74ff567c283","updated_by":"68257ce8686567f71bff990b","created_at":"2024-05-18T08:10:34.356Z","updated_at":"2026-06-12 iewers want to see how you’ve handled real situations, how you work with others, communicate, and respond to challenges. This round is also about figuring out if you’d fit into the company’s culture and team. Clear, specific examples matter here. The way you talk about what you’ve learned, handled setbacks, or worked with a team can make a big difference.\\nIn this session, Devyani Saxena, Growth Product Manager at Simpl, shares her approach to behavioral interview questions. She talks through how to structure your responses, pick the right stories, and connect your answers back to the values the company cares about. You’ll see that it’s not about following a script, but about finding ways to bring your own personality and experience into your answers.\\n\\n\"},{\"attributes\":{\"bold\":true},\"insert\":\"Who this is for:\"},{\"insert\":\"\\nIf you want to get more comfortable with behavioral and culture fit rounds, this session gives you a template for thinking about your stories. Watch for examples, but make sure to add your own details, skills, and real experience to stand out when it counts.\\n\"}]}","active":true,"type":"video","meta":{"functions":[],"tags":[]},"content_type":"url","cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/6672d815b883e159f358f257.png","duration":821,"ancestry":{"64e373f80e8cd1d7844c0b28":{"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f","sequence":1},"664ad214b7b82cc132c4b223":{"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f","sequence":3},"664b5138ca2547c024beba47":{"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f","sequence":6},"664b520b1d9da003cb114a86":{"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f","sequence":4}},"created_by":"6419ac68fd65ea3df9b42d02","updated_by":"68257ce8686567f71bff990b","authors":[],"created_at":"2024-06-19T13:07:33.674Z","updated_at":"2026-06-12T11:14:14.662Z","__v":0,"content_key_id":"73127b28-4cc1-da74-f81b-182e7cdd984f","default_access_status":{"64e373f80e8cd1d7844c0b28":"ACTIVE","664ad214b7b82cc132c4b223":"ACTIVE","664b5138ca2547c024beba47":"ACTIVE","664b520b1d9da003cb114a86":"ACTIVE"},"tags":{"role_to_crack":["PRODUCT"],"interview_journey":["IN_TECHNICAL_ROUNDS"],"problem":["COMMUNICATION_ISSUES"]},"filters":["EL03Prep for interviews.EL01Interview basics.EL03Culture fit"],"mux_asset_id":"cP5dLI02GH5hQmUvShD6lEgsvdJz01vNZbGRqgmDshIJo","mux_playback_id":"01kpT01Am2aIj8MPHG2P9jLnqOItFczU8dqkJ3OpHGm02c"},{"_id":"667e6eee33b31a2463627dc3","moduleId":"cracking_behavioural_round_with_jatin_premjani__growth_manager___swiggy_mqjsq","name":"Growth manager expectations: Culture alignment","description":"{\"ops\":[{\"attributes\":{\"bold\":true},\"insert\":\"What this session covers:\"},{\"insert\":\"\\nBehavioral rounds are where interviews get real. It’s less about your title or what’s on your resume, and more about how you actually work with people, solve problems, and show up when things get messy. The questions are designed to uncover what you’re like day to day, how you handle setbacks, build trust with your team, and make decisions under pressure. The goal isn’t just to see if you’re capable, but to figure out if you’ll thrive in their environment and contribute to the team in a meaningful way.\\nIn this video, Jatin Premjani, Growth Manager at Swiggy, takes on some of the toughest and most common behavioral questions from growth interviews. He shares how he finds the right stories from his own experience and shapes them into answers that actually mean something. It’s a look at the side of interviewing that’s all about who you are, not just what you do.\\n\\n\"},{\"attributes\":{\"bold\":true},\"insert\":\"Who this is for:\"},{\"insert\":\"\\nIf you want to show up as yourself in interviews and move past the standard “strengths and weaknesses” routine, this session will help you rethink your approach. Use Jatin’s process as a starting point, but bring in your own voice and real stories to stand out.\\n\"}]}","type":"video","meta":{"functions":[],"tags":[]},"cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/667e6eee33b31a2463627dc3.png","ancestry":{"64e373f80e8cd1d7844c0b28":{"parent":"664853211f5fb679bd10480f","root":"664853211f5fb679bd10480f","sequence":4}},"created_by":"6419acdcfe17137ae6b4a1c2","updated_by":"68257ce8686567f71bff990b","authors":[],"created_at":"2024-06-28T08:06:06.631Z","updated_at":"2026-06-12T11:18:50.067Z","__v":0,"duration":610,"content_key_id":"6c281a1c-33f8-8115-0648-bbf13ef318ee","active":true,"default_access_status":{"64e373f80e8cd1d7844c0b28":"ACTIVE"},"tags":{"role_to_crack":["GROWTH","MARKETING"],"interview_journey":["IN_TECHNICAL_ROUNDS"],"problem":["COMMUNICATION_ISSUES"]},"filters":["EL03Prep for interviews.EL01Interview basics.EL03Culture fit"],"mux_asset_id":"B01koG5Cwmm2jSdbSNTR01mO8X5318TUVoQgeL9uLACxY","mux_playback_id":"JX3XRm02mPdknthL01q8twE6MOrHT7J02W00HcYF4xDNlGc"},{"_id":"669a234600e8ef42e88d4567","moduleId":"three_core_levers_to_growth_roles_85ofg","name":"Growth role expectations vs reality","subtitle":"And how you can leverage them","type":"text","meta":{"functions":[],"tags":[]},"content_type":"gx-editor","duration":93,"ancestry":{"669a2242217d492b03387c01":{"parent":"669a22f38d13632444a165f0","root":"669a22f38d13632444a165f0","sequence":1},"64e373f80e8cd1d7844c0b28":{"parent":"660d602cce2b26668533387d","root":"660d602cce2b26668533387d","sequence":22}},"created_by":"667a7120ad2536b5107353b5","updated_by":"68257ce8686567f71bff990b","authors":[],"created_at":"2024-07-19T08:26:46.894Z","updated_at":"2025-05-16T08:04:07.188Z","__v":0,"active":true,"cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/669a234600e8ef42e88d4567.png","default_access_status":{"669a2242217d492b03387c01":"ACTIVE","64e373f80e8cd1d7844c0b28":"ACTIVE"},"tags":{"role_to_crack":["GROWTH","PRODUCT","MA "GROWTH","PRODUCT","MARKETING"],"interview_journey":["NOT_STARTED"],"problem":["CAREER_CLARITY"]},"mux_asset_id":"j63P4rIQh4500Xvlvd4TnyVROI7EWurP01sD2EsvZ3lpw","mux_playback_id":"aQFsJsgLT2DD4WlD6Pc3eEGR8y9d5bbfsE8EgbXIZ6A"},{"_id":"67378d93d4b83d208ee58f04","filters":["EL03Prep for interviews.EL01Interview basics.EL01First round"],"moduleId":"how_to_talk_address_career_breaks_in_interviews_ca1gf","name":"How to position career gaps as strengths","description":"{\"ops\":[{\"attributes\":{\"bold\":true},\"insert\":\"What this session covers:\"},{\"insert\":\"\\nBy now, you’ve probably heard a few different takes on how to talk about career breaks in interviews. In this short video, Aditya Ramakrishnan, former VP of Marketing at imagekit.io, shares his perspective from both sides of the table. His approach is straightforward: be honest, be authentic, and don’t overthink it. He points out that if it’s the right company, a gap won’t be held against you, and if it is, that’s a signal worth paying attention to.\\n\\n\"},{\"attributes\":{\"bold\":true},\"insert\":\"Who this is for:\"},{\"insert\":\"\\nIf you’re worried about how a career break might be viewed or want a more relaxed, real-world way to address it, this session gives you a simple, honest path to follow.\\n\"}]}","type":"video","meta":{"functions":[],"tags":[]},"cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/67378d93d4b83d208ee58f04.png","duration":67,"ancestry":{"64e373f80e8cd1d7844c0b28":{"parent":"660d602cce2b26668533387d","root":"660d602cce2b26668533387d","sequence":13}},"created_by":"667a71939dcf8a6481f68ee2","updated_by":"669f8bfb836a609c59c0231e","authors":[],"created_at":"2024-11-15T18:06:11.083Z","updated_at":"2026-06-12T11:25:27.325Z","__v":0,"content_key_id":"d5e8ec5f-b4f9-5ec4-89ab-fe9b3085ae22","active":true,"tags":{"role_to_crack":["GROWTH","PRODUCT","MARKETING"],"interview_journey":["IN_TECHNICAL_ROUNDS"],"problem":["COMMUNICATION_ISSUES"]},"mux_a 6a609c59c0231e","authors":[],"created_at":"2024-08-29T18:47:09.037Z","updated_at":"2025-07-18T13:11:21.712Z","__v":0,"active":true,"default_access_status":{"64e373f80e8cd1d7844c0b28":"ACTIVE","66d14c1112721233fdb625f1":"ACTIVE"},"tags":{"role_to_crack":["GROWTH","PRODUCT","MARKETING"],"interview_journey":["NOT_STARTED","STARTED_APPLYING"],"problem":["GETTING_CALLBACKS"]}},{"_id":"67220d9ea09ed267adf736d4","filters":["EL00Plan your next move.EL00Career planning"],"moduleId":"lessons_from_making_multiple_career_transitions_gkx0b","name":"Steps for switching careers smoothly","description":"{\"ops\":[{\"attributes\":{\"bold\":true},\"insert\":\"What this session covers: \"},{\"insert\":\"\\nSaket Toshniwal, Senior Director at MoEngage, has navigated multiple career shifts-from founding an e-commerce startup to digital marketing, CRM, technical product management, and leading growth and product marketing teams. He shares what it takes to make these transitions, which transferable skills made the biggest difference, and the lessons he learned along the way. You’ll get practical strategies for navigating career moves, building in-demand skills, and avoiding common pitfalls.\\n\\n\"},{\"attributes\":{\"bold\":true},\"insert\":\"Who this is for: \"},{\"insert\":\"\\nThis session is for anyone considering a career pivot or looking to grow across functions. If you want a grounded take on making transitions work and want to learn from someone who’s done it in real time, you’ll find practical guidance here.\\n\"}]}","meta":{"functions":[],"tags":[]},"ancestry":{"64e373f80e8cd1d7844c0b28":{"parent":"6687f8c9a46ae0bd7ca442dc","root":"6687f8c9a46ae0bd7ca442dc","sequence":19}},"created_by":"667a71939dcf8a6481f68ee2","updated_by":"68257ce8686567f71bff990b","authors":[],"created_at":"2024-10-30T10:42:38.113Z","updated_at":"2026-06-12T11:36:12.380Z","__v":0,"cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/67220d9ea09ed267adf736d4.png","du  relationships that actually matter. You’ll hear firsthand how they’ve tackled workplace bias, learned to advocate for themselves, and focused on creating environments where everyone can do their best work. \\n\\n\"},{\"attributes\":{\"bold\":true},\"insert\":\"Who this is for: \"},{\"insert\":\"\\nIf you’re aiming for leadership, thinking about returning to work, or want honest advice on navigating your career as a woman, this session is packed with lived experience and actionable strategies. Whether you’re managing a team now or planning your next big move, you’ll come away with tools to grow with clarity and confidence.\\n\"}]}","type":"video","meta":{"functions":[],"tags":[]},"duration":5775,"ancestry":{"64e373f80e8cd1d7844c0b28":{"parent":"67a39084b8899f57afd0c808","root":"67a39084b8899f57afd0c808","sequence":1}},"created_by":"667a71939dcf8a6481f68ee2","updated_by":"68257ce8686567f71bff990b","authors":[],"created_at":"2024-12-23T05:04:43.157Z","updated_at":"2026-06-12T11:27:32.166Z","__v":0,"content_key_id":"97d8d156-a631-4912-223d-214416661d05","cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/6768ef6b2ad5a6b516f62baa.png","active":true,"tags":{"role_to_crack":["GROWTH","PRODUCT","MARKETING"],"interview_journey":["NOT_STARTED"],"problem":["CAREER_CLARITY"]},"mux_asset_id":"YaBWobzYO56M63xMrkvVtrLoAU4Paq9P55GvfDwbL6Y","mux_playback_id":"mMurXfW7fmE101mGGDKhXnV6pPfJlANWWRtvD1pFj3eg"},{"_id":"6708d84abf529564bcbe7d78","filters":["EL00Plan your next move.EL00Career planning"],"moduleId":"insights_from_women_leaders_in_marketing_ivf4g","name":"Stories from women who lead marketing teams","type":"text","meta":{"functions":[],"tags":[]},"content_type":"gx-editor","cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/6708d84abf529564bcbe7d78.png","duration":257,"ancestry":{"64e373f80e8cd1d7844c0b28":{"parent":"67a39084b8899f57afd0c808","root":"67a39084b8899f57afd0c808","sequence":6 ,\"insert\":\"Who this is for:\"},{\"insert\":\"\\nIf you’ve ever looked at a job description and felt underqualified, or wondered how to stand out against tough odds, this session is for you. You’ll get honest, step-by-step reflections on how to tackle the process, even if you don’t check every box on paper.\\n\"}]}","type":"video","meta":{"functions":[],"tags":[]},"cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/6741a806df20235d18e2834f.png","ancestry":{"64e373f80e8cd1d7844c0b28":{"parent":"660d602cce2b26668533387d","root":"660d602cce2b26668533387d","sequence":8}},"created_by":"667a71939dcf8a6481f68ee2","updated_by":"68257ce8686567f71bff990b","authors":[],"created_at":"2024-11-23T10:01:42.240Z","updated_at":"2026-06-12T11:32:55.077Z","__v":0,"duration":1299,"content_key_id":"cef6ef9f-5834-4779-2eab-616f400a1f26","active":true,"tags":{"role_to_crack":["GROWTH","PRODUCT","MARKETING"],"interview_journey":["IN_TECHNICAL_ROUNDS"],"problem":["COMMUNICATION_ISSUES"]},"mux_asset_id":"XYa9QLqSYfbQTXobadPwe01zGVn02f8YvH1g4P9lNyBNE","mux_playback_id":"02g00S9JmZXcUiGPw5qI789gd6ZOWPwpfXyoIQ4UfMEoQ"},{"_id":"66250e430fa9b658abb17c20","moduleId":"assignment-deep-dive-with-senior-product-manager-at-urban-piper","name":"What Urban Piper wants from senior PMs","type":"video","meta":{"functions":[]},"content_type":"url","cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/66250e430fa9b658abb17c20.png","duration":1861,"ancestry":{"64e373f80e8cd1d7844c0b28":{"parent":"660ad0acc14c3e00fa9063f8","root":"660ad0acc14c3e00fa9063f8","sequence":4},"664b520b1d9da003cb114a86":{"parent":"660ad0acc14c3e00fa9063f8","root":"660ad0acc14c3e00fa9063f8","sequence":4},"664b5138ca2547c024beba47":{"parent":"660ad0acc14c3e00fa9063f8","root":"660ad0acc14c3e00fa9063f8","sequence":5},"664ad214b7b82cc132c4b223":{"parent":"660ad0acc14c3e00fa9063f8","root":"660ad0acc14c3e00fa9063f8","sequence":4}},"created_by":"6419acdcfe Z","updated_at":"2026-06-12T11:29:03.059Z","__v":0,"content_key_id":"8d5b050d-620f-0e67-6977-7205b686d61d","active":true,"mux_asset_id":"hAGOBdUukAp2v2ws5Ml02ZduXcgqsyFj1QdvkV5SPuys","mux_playback_id":"CabsIEk3QURoBuxBYSpJGvZmxZYaFh5GGI2oJlyhCRY"},{"_id":"6687ecbaad7858a9c0f28a95","moduleId":"strategy___growth_at_winzo_5gqoo","name":"What their hiring tells us about gaming growth","description":"{\"ops\":[{\"attributes\":{\"bold\":true},\"insert\":\"What this session covers: \"},{\"insert\":\"\\nAnalyzing job descriptions before you apply helps you tailor your application and prepare more effectively. In this session, we dig into the Strategy \u0026 Growth JD at Winzo showing how to break down the requirements, highlight your fit, and anticipate what might come up in interviews. You’ll learn how to approach strategic and growth-oriented roles with a sharper lens and position yourself for the right opportunities.\\n\\n\"},{\"attributes\":{\"bold\":true},\"insert\":\"Who this is for: \"},{\"insert\":\"\\nThis session is useful for anyone considering roles in strategy or growth, or looking to improve how they analyze and respond to JDs. If you want to apply more intentionally and stand out in the hiring process, you’ll pick up practical tips here.\\n\"}]}","type":"video","meta":{"functions":[],"tags":[]},"cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/6687ecbaad7858a9c0f28a95.png","duration":435,"ancestry":{"64e373f80e8cd1d7844c0b28":{"parent":"6687a2bd04916acea1bae9dc","root":"6687a2bd04916acea1bae9dc","sequence":4},"664b5138ca2547c024beba47":{"parent":"6687a2bd04916acea1bae9dc","root":"6687a2bd04916acea1bae9dc","sequence":1}},"created_by":"667a7120ad2536b5107353b5","updated_by":"68257ce8686567f71bff990b","authors":[],"created_at":"2024-07-05T12:53:14.285Z","updated_at":"2026-06-12T11:15:10.992Z","__v":0,"content_key_id":"89890f6f-ab3c-5586-0628-66adf6316260","active":true,"default_access_status":{"64e373f80e8cd1d7844c0b n.\\n\\n\"},{\"attributes\":{\"bold\":true},\"insert\":\"Who this is for:\"},{\"insert\":\"\\nIf you want to understand the key performance indicators for large-scale video platforms or sharpen your skills in product analytics, this session is a great resource. It’s designed for product managers, growth leaders, and strategists working with digital content and media.\\n\\nThe answers and assumptions will change based on your understanding, knowledge and experience. However, the framework is constant and that’s the core takeaway for you from these videos.\\n\\n\"},{\"insert\":{\"image\":\"https://du2l2d5icvsbf.cloudfront.net/product_images/elevate/Product%20metric/product-metric.png\"}},{\"insert\":\"\\n\"}]}","duration":848,"type":"video","content_key_id":"747bfbc8-2e01-573d-b740-e3f8ce86c07c","default_access_status":{"64e373f80e8cd1d7844c0b28":"ACTIVE","664b520b1d9da003cb114a86":"ACTIVE","664b5138ca2547c024beba47":"ACTIVE","664ad214b7b82cc132c4b223":"ACTIVE"},"tags":{"role_to_crack":["GROWTH","PRODUCT"],"interview_journey":["IN_TECHNICAL_ROUNDS"],"problem":["COMMUNICATION_ISSUES"]},"filters":["EL03Prep for interviews.EL02Problem solving round.EL04Product metrics"],"mux_asset_id":"zi28r3UDkPKdNk5kkx01F01r7XnugzM8AI6wpnZdngr900","mux_playback_id":"ibyioq42g602aq2vDT00XD8OpFu9IkfyYlt3iq00A01yS8g"},{"_id":"64e3bce50e8cd1d7844c416c","moduleId":"estimate-the-number-of-videos-watched-on-youtube-everyday","name":"YouTube views: Scale estimation framework","active":true,"type":"video","meta":{"functions":["product","growth","marketing","strategy","design","sales"]},"preview_url":"https://du2l2d5icvsbf.cloudfront.net/product_videos/outcomes/elevate-previews/how-many-videos-are-watched-on-youtube-per-day-.mp4","content_type":"url","duration":826,"ancestry":{"64e373f80e8cd1d7844c0b28":{"parent":"64e3866b0e8cd1d7844c25c1","root":"64e3866b0e8cd1d7844c25c1","sequence":8},"664b520b1d9da003cb114a86":{"parent":"64e3866b0e8cd1d7844c25c1","root":"64e3866b0e8cd1d7844c25c1","sequence":7 u as much as for the interviewer. It’s a real test of fit on both sides.\\nIt’s not just about having the right answer, but about how you structure and present your work. \\nIn this video, Ashish Mundra, a GrowthX member, takes you through the assignment he completed to crack the Product Manager role at Zerodha Fund House. You’ll see how he approached the problem, organized his response, and presented his ideas in a way that stood out.\\n\\n\"},{\"attributes\":{\"bold\":true},\"insert\":\"Who this is for:\"},{\"insert\":\"\\nIf you’re preparing for assignment rounds or want to see what a successful submission looks like, this session will give you practical ideas and a real example to learn from. Especially useful for anyone looking to build confidence before their own assignment.\\n\"}]}","active":true,"default_access_status":{"64e373f80e8cd1d7844c0b28":"ACTIVE"},"tags":{"role_to_crack":["PRODUCT"],"interview_journey":["STARTED_APPLYING","IN_TECHNICAL_ROUNDS"],"problem":["COMMUNICATION_ISSUES"]},"mux_asset_id":"1OpFgbmx9ULm3ySamfOMMo18A9c4RUkkq7Acf3pue00s","mux_playback_id":"l3a8pSWlFgq3TJND00dGnhaJW01mlVlxPrr55V00tNPHIY"},{"_id":"65ae2df3b3451dd4778f64e6","moduleId":"how-would-you-launch-zoom-in-india--practice-gtm-with-ud-","name":"Zoom India launch: Localization strategy","type":"video","meta":{"functions":[]},"cover_photo":"https://public-cdn.growthx.club/bulk-uploads/64e373f80e8cd1d7844c0b28/thumbnails/65ae2df3b3451dd4778f64e6.png","duration":2280,"ancestry":{"64e373f80e8cd1d7844c0b28":{"parent":"64e3bdf30e8cd1d7844c41dc","root":"64e3bdf30e8cd1d7844c41dc","sequence":4},"664b520b1d9da003cb114a86":{"parent":"64e3bdf30e8cd1d7844c41dc","root":"64e3bdf30e8cd1d7844c41dc","sequence":2},"664b5138ca2547c024beba47":{"parent":"64e3bdf30e8cd1d7844c41dc","root":"64e3bdf30e8cd1d7844c41dc","sequence":4},"664ad214b7b82cc132c4b223":{"parent":"64e3bdf30e8cd1d7844c41dc","root":"64e3bdf30e8cd1d7844c41dc","sequence":7}},"created_by":"6419acdcfe17137ae6b4a1c2","updated_by":"68257ce
