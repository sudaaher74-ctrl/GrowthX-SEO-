d creative strategy that fuels brand growth and drives real, measurable business impact.","cover_photo":"https://public-cdn.growthx.club/product_images/production/creative-strategy/cover_photo/4e971ddc3e-creative_strategy-m.png","video_url":"https://public-cdn.growthx.club/learning-experience-products/production/creative-strategy/trailer/3565b29121-CRAFT of Creative Strategy 💎.mp4","search_filters":[{"function":["Marketing","Design","Growth"],"role":["Marketer","Growth operator"],"goal":["Launch a major brand campaign","Improve our marketing creative","Write a creative brief that works","Manage a video ad production"],"skill":["Creative strategy\nCreative briefing\nConcept development \u0026 evaluation\nConsumer insights\nProduction management"],"level":"Advanced","duration":"Long","ai_generated":"No","text_only":false},{"domain":["B2C"]},{"function":["Marketing","Growth","Founder"],"association":["The big idea","Creative brief","Customer insight","Value proposition","Brand voice","Campaign concept.","Research","Ideation","Concepting","Testing","Execution","Measurement.","Subjective feedback","I'll know it when I see it","Ineffective creative","Off-brand","No measurable impact.","Memorable campaigns","Measurable impact","Consistent brand","Emotional connection","Stand out from the noise.","Brand strategist","Art director","Copywriter","Brand manager","Creative director."]}],"total_modules":10,"duration":5231},"landingPage":{"_id":"67e0ff759c5f72d2e0c9823b","productId":"creative-strategy","name":"Creative Strategy","requires_subscription":true,"events":[],"modules":["67e0ff9c6cedfd970907d6b9","67e0fffa9c5f72d2e0c9855a","67e1546f90c62659cd392081","67e154be8e44f2ee5c36bf26","67e15583d0c4c5cb7bd6ca1e","67e1009b6d66b3151969b775"],"type":"LX","free_preview_modules":[],"authors":[{"name":"Ashwath Swaminathan","photo":"https://public-cdn.growthx.club/product_images/production/creative-strategy/Ashwath Swaminathan/e27ab15ec3-DSC04660.png","tagline":"Ex-CGMO | Swiggy"}],"active":true,"subtitle":"Build a solid creative strategy that fuels brand growth and drives real, measurable business impact.","cover_photo":"https://public-cdn.growthx.club/product_images/production/creative-strategy/cover_photo/4e971ddc3e-creative_strategy-m.png","video_url":"https://public-cdn.growthx.club/learning-experience-products/production/creative-strategy/trailer/3565b29121-CRAFT of Creative Strategy 💎.mp4","total_modules":10,"duration":5231,"landing_page":{"_id":"67eaa57e254c39f83319e12d","key":"creative-strategy","type":"CRAFT","status":"LIVE","product_id":"67e0ff759c5f72d2e0c9823b","flow":{"with_card":[{"visibility":"PUBLIC","type":"HERO_SECTION","version":1,"content":{"title":"Creative Strategy","description":"This CRAFT will take you from business objectives to writing a high-impact brief and executing with excellence, so your creative doesn't just stand out but scales brand and revenue.","aboutProduct":"Most people think creativity is a stroke of genius—something you either have or don’t. That’s where they go wrong. The most iconic brand campaigns aren’t luck or genius; they’re a structured mix of art and science. A strong creative strategy drives business impact. It turns insights into powerful storytelling that makes people feel, remember, and take action. Yet, it’s sometimes treated as an afterthought. That changes now. This CRAFT will take you from business objectives to writing a high-impact brief and executing with excellence, so your creative doesn’t just stand out but scales brand and revenue.","builtFor":[{"icp":"BRAND \u0026 GROWTH MARKETERS","description":"Designed to help you build high-impact creative campaigns that drive real business metrics from acquisition to retention to brand loyalty."},{"icp":"CREATIVE TEAMS","description":"You’ve been running ads, building assets, working with agencies. This CRAFT will give you the structure and framework to create impactful, repeatable, and scalable campaigns."},{"icp":"FOUNDERS","description":"You’re building a brand from scratch and need a structured approach to your creative, one that isn’t driven by gut but is built on strategy and outcomes. This CRAFT solves for just that."}],"short_trailer":"https://public-cdn.growthx.club/product_videos/cs_short_trailer.mp4"}},{"visibility":"PUBLIC","type":"ENROLL_CARD_LIST","version":1,"content":{"features":[{"text":"Cinematic learning experience","icon":"https://public-cdn.growthx.club/media/signup/module-icon.png"},{"text":"15+ comprehensive learning modules","icon":"https://public-cdn.growthx.club/media/signup/cube.png"},{"text":"Learn at your own pace","icon":"https://public-cdn.growthx.club/media/signup/clock.png"}]}},{"visibility":"PUBLIC","type":"PROGRAM_DIRECTOR","version":1,"content":{"name":"Ashwath Swaminathan","tagline":"Marketing leader","description":"Over the past 2 decades, I've led marketing multiple teams and built brands across industries in leadership roles at Unilever, Swiggy, and more.\n\nIn today's world, creative strategy is no longer just about big ideas or flashy eye-catching campaigns. It's about connecting your business objectives with creative concepts that drives real, measurable growth.\n\nThroughout my career, I've honed the ability to connect strategy and creativity to build strategies that drive impact across Global and Indian companies. From my time at Unilever, where I led diverse verticals and teams across beauty, beverages, and personal care to my role as the CGMO at Swiggy where we transformed the brand with innovative campaigns, I've seen firsthand how great creative strategy fuels growth.\n\nI've distilled all these learnings into this CRAFT. You'll learn how to define your business objectives and insights, write briefs that inspire and build campaigns that drive growth across touchpoints.","photo":"https://public-cdn.growthx.club/product_images/crafts/cs-pd.webp","logos":"https://public-cdn.growthx.club/product_images/crafts/cs-logos.svg","avatar":"https://public-cdn.growthx.club/product_images/crafts/ashwath-avatar.webp"}},{"visibility":"PUBLIC","type":"OUTCOME_SLIDER","version":1,"content":{"outcomes":[{"title":"Nail the business objective and insight.","description":"Every successful campaign starts with a solid foundation. Define your business objective, deduce core insights, and translate them into a clear marketing job to be done."},{"title":"Craft a compelling brief.","description":"Learn to craft briefs that inspire, not prescribe. Get this step right by nailing 4 key aspects of a good creative brief: the insight, main point, target audience and task map."},{"title":"Articulate the creative idea.","description":"With your brief in place, learn how to evaluate the concepts your creative team presents, articulate the heart of the campaign — your creative idea, and provide clear, actionable feedback."},{"title":"Ensure production excellence.","description":"Once your creative concept is locked in, it's time to bring it to life. Learn how to lift the script to a great execution by understanding what to do, how to do it and what to avoid."}]}},{"heading":"question","visibility":"PUBLIC","type":"FAQ","version":1,"content":{"faqs":[{"summary":"What will I learn in this course?","detail":"By the end of this CRAFT, you will build a high-impact creative strategy that drives real business impact.\n\nYou’ll leave with 4 core learning outcomes: \n- Translate your business objective into the marketing JTBD.  \n- Write sharp briefs that inspire your creative teams.  \n- Articulate the heart of the campaign.  \n- Ensure production excellence in every campaign."},{"summary":"Who is this CRAFT for?","detail":"The CRAFT of Creative Strategy is built for brand marketers, founders, and growth leaders looking to nail their creative strategy, build impactful campaigns, and drive business growth."},{"summary":"Who is this CRAFT not for?","detail":"This CRAFT is not meant for folks who are not looking to scale their creative strategy.  Additionally, if you’re currently in pre-PMF, this course may not be for you."},{"summary":"Who will I learn from?","detail":"The program director for Creative Strategy is Ashwath Swaminathan, former Chief Growth \u0026 Marketing Officer at Swiggy.\n\nWith over 20 years of marketing experience, Ashwath has built, scale and led brands and categories. He began his journey at Unilever, leading marketing teams across beauty, beverages, personal care, and more. Later, as the CGMO at Swiggy, he drove significant growth via innovative campaigns and strategies.\n\nHe has distilled his expertise into this CRAFT, where he'll teach you how to build a solid creative strategy and deliver campaigns that drive measurable business impact."}]}},{"visibility":"PUBLIC","type":"SEO_METADATA","version":1,"content":{"ogImage":"https://public-cdn.growthx.club/learning-experience-products/local/brand-led-growth/brand-led-growth/9ac99bee86-CS Horizontal Thumbnail.png","ogTitle":"Creative Strategy","ogDescription":"Learn to build creative strategy that leads to high-impact campaigns that drive real business results."}},{"visibility":"PUBLIC","type":"CURRICULUM","version":1,"content":{"modules":[{"_id":"659966cca141bb09cee6eb84","moduleId":"Introduction to Creative strategy","name":"Introduction to Creative strategy","subtitle":"Module 1","summary_icon":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/intro.svg","sub_modules":[{"_id":"65aa9f5bf8b7f2a7c86c2f01","name":"Core outcomes of the CRAFT","description":"Learn to translate business objectives and insights into campaigns that drive brand and revenue. Dive deep into writing impactful briefs, articulating the creative idea, and nailing production."},{"_id":"65aa9f5bf8b7f2a7c86c2f01","name":"Introduction to Creative Strategy","description":"We'll dive into the 4 key pillars of building a creative strategy and building memorable campaigns."}]},{"_id":"659966cca141bb09cee6fb84","moduleId":"Framework to creative strategy","name":"Frame
