they deserve.\n\nBut GrowthX isn’t for everyone. It’s not a course. Not a Slack group. And definitely not another “networking” platform. It’s a private club of 5,500+ operators who lead product, marketing, and growth at companies like Razorpay, Jio, Swiggy, Zerodha, and Freshworks. Founders, VPs, ICs—all united by one obsession: compounding their career and company’s growth.\n\nWhat they get is an unfair edge. Live learning programs taught by people who’ve actually scaled. Access to a private community that doesn’t tolerate fluff—just sharp questions and sharper answers. Tools to grow into leadership roles, break into new ones, or scale from $0 to $10M if you’re a founder. And yes, they meet offline too. Every month. Roundtables, mixers, deep-dive sessions—held across 7 major Indian cities.","industry":"Education","sub_industry":"Edtech","function":"Founder","domain":[],"current":true,"attachments":[],"_id":"69dbaa0eb3d0ee0d68755063"},{"company":"65e614ed6900383311358031","role":"Product Lead - Growth","start_date":"2020-04-01T00:00:00.000Z","end_date":"2021-10-01T00:00:00.000Z","employment_type":"Full-time","description":"Central growth team working across all business lines of Razorpay. (Payments, Capital \u0026 Banking)","industry":"Technology","sub_industry":"Software Development","function":"Growth","domain":[],"current":false,"attachments":[],"_id":"69dbaa0eb3d0ee0d68755064"},{"company":"63f0a45d25c50aeec142fabe","role":"Product Lead - Growth","start_date":"2020-03-31T18:30:00.000Z","end_date":"2021-10-30T18:30:00.000Z","description":"Central growth team working across all business lines of Razorpay. (Payments, Capital \u0026 Banking)","industry":"Technology","sub_industry":"Information Technology","function":"Growth","domain":[],"current":false,"attachments":[],"_id":"69b65648ec2e5fba173652ee"},{"company":"65e614ed6900383311358031","role":"Product","start_date":"2019-10-01T00:00:00.000Z","end_date":"2020-04-01T00:00:00.000Z","employment_type":"Full-time","description":"I transitioned to the Product function to setup the first product growth team at Razorpay. The team built product capabilities that drove growth. from segmentation services, campaign api, to product led sales.","industry":"Technology","sub_industry":"Software Development","function":"Product","domain":[],"current":false,"attachments":[],"_id":"69dbaa0eb3d0ee0d68755065"},{"company":"63f0a45d25c50aeec142fabe","role":"Product","start_date":"2019-09-30T18:30:00.000Z","end_date":"2020-04-29T18:30:00.000Z","description":"I transitioned to the Product function to setup the first product growth team at Razorpay. The team built product capabilities that drove growth. from segmentation services, campaign api, to product led sales.","industry":"Technology","sub_industry":"Information Technology","function":"Founder","domain":[],"current":false,"attachments":[],"_id":"69b65648ec2e5fba173652ef"},{"company":"63f70aab13f07773dc332f93","role":"GrowthX Community","start_date":"2019-04-30T18:30:00.000Z","end_date":"2021-10-30T18:30:00.000Z","description":"We started GrowthX community as a side hustle to solve our own paint point.\n\nMore contexy 👇\n\nAll communities that existed were primarily made for folks to help them crack their first job. However, being in mid-senior roles, Udayan at Razorpay and Abhishek at CRED, they wanted a close nit community of operators \u0026 founders who they can learn from. They wanted to soundboard, brainstorm \u0026 ideate on growth problems. \n\nWe realised that as we grew in our careers, the journey became more and more lonely. To solve this, we started our own community called GrowthX. But we didn’t like the way current communities were setup. We felt they were too superficial. We did not want to connect with 100s of folks and talk about random things.\n\nSo we created a different kind of a community– a learning community. The insight was that we truly bond with people who we problem solve with. So, every week we selected 6-8 people, these folks would look at their own company's problem statement and solve it using a Harvard case study format.\n\nOver the 2 years, we built a super strong community of 300 folks. We never wanted to become a large community just for the sake of a vanity number. Our community is characterized by people who keep in touch, who solve problems together, and who form lasting connections.\n\nOver those 2 years, our community asked for longer, more structured version of our meetups- so we launched a 5 week program that teaches folks everything from acquisition, onboarding, engagement, retention \u0026 monetization.\n\nWe got sold out in 23 hours. And the rest is history.","industry":"Education","sub_industry":"Edtech","function":"Founder","domain":[],"current":false,"attachments":[],"_id":"69b65648ec2e5fba173652f0"},{"company":"65e614ed6900383311358031","role":"Product Marketing Manager 2","start_date":"2019-02-01T00:00:00.000Z","end_date":"2019-10-01T00:00:00.000Z","employment_type":"Full-time","description":"First product marketing manager for platform product.","industry":"Technology","sub_industry":"Software Development","function":"Marketing","domain":[],"current":false,"attachments":[],"_id":"69dbaa0eb3d0ee0d68755067"},{"company":"63f0a45d25c50aeec142fabe","role":"Product Marketing Manager 2","start_date":"2019-01-31T18:30:00.000Z","end_date":"2019-10-30T18:30:00.000Z","description":"First product marketing manager for platform product.","industry":"Technology","sub_industry":"Information Technology","function":"Growth","domain":[],"current":false,"attachments":[],"_id":"69b65648ec2e5fba173652f1"},{"company":"69b5c57dfa092df3bc610b45","role":"Product Marketing Lead","start_date":"2018-02-28T18:30:00.000Z","end_date":"2019-02-27T18:30:00.000Z","description":"As a Product Marketing Manager at OnlineSales.ai (Formerly Sokrati), I'm responsible for creating successful GTM kits, product launch strategies, accelerating user growth, increasing daily active users, driving product engagement and feature adoption.\n\nKey Highlights:\n\n- Launched over 100 lifecycle communication milestones in our first ever multi-channel communication framework which increased our daily active users by 30%. The various channels were dashboard comms, in-app messages, emails, in-app banners/pop-ups, etc. This was all built-inhouse.\n\n- Ideated and led successful Go-To-Marketing strategies for all our core products right from\nacquisition, retention, price positioning, up-sell, and more.\n\n- Defined and streamlined communication triggers through the all stages of the user journey from Onboarding – Activation– Adoption–Engagement–Celebratory-Upsell–Retention etc.\n\n- Ideated and executed a 5 step unsubscribe flow which reduced our unsubscribe rate by 12% in just 45 days. This also generated valuable feedback which helped us improve our current UX.\n\n- Automated up-sells on OnlineSales.ai through smart communication frameworks and behavioral data targeting.","industry":"Technology","sub_industry":"Technology","function":"Marketing","domain":[],"current":false,"attachments":[],"_id":"69b65648ec2e5fba173652f2"},{"company":"69b5c57dfa092df3bc610b45","role":"Growth Marketing Manager","start_date":"2017-10-31T18:30:00.000Z","end_date":"2018-03-30T18:30:00.000Z","description":"During my time as a Growth Marketing Lead, I drove growth in 5 key areas i.e. SEO/ASO, Inbound Leads, Website CRO \u0026 Email Automation.\n   \n• In 9 months I delivered 7X growth in organic traffic which completely restructured our acquisition source from outbound to inbound.\n• Pioneered and a Led a new website that boosted our conversion rate from 0.8% to 4.3%\n• Ideated and executed various optimization tactics to reduce our bounce rate from 65% to 15%\n• Led triple digit growth in blog subscribers from 82 to 10,000+\n• Drove 5.8X increase in total monthly users on the website.\n• Boosted time on website 1:54 seconds to 5:25 seconds.\n• ASO on Shopify and BigCommerce app stores directly resulting in a 6X growth in installs. \n• Ideated, developed \u0026 executed email marketing automations for all stages of the sales funnel resulting in 40% open rates \u0026 12% CTR.","industry":"Technology","sub_industry":"Technology","function":"Growth","domain":[],"current":false,"attachments":[],"_id":"69b65648ec2e5fba173652f3"},{"company":"6603c046c227ec4e2d59cd97","role":"Inbound Marketer","start_date":"2017-02-28T18:30:00.000Z","end_date":"2017-11-29T18:30:00.000Z","industry":"Media","sub_industry":"Media Production","function":"Marketing","domain":[],"current":false,"attachments":[],"_id":"69b65648ec2e5fba173652f4"},{"company":"69b5c57dfa092df3bc610b45","role":"Growth Marketer","start_date":"2017-02-28T18:30:00.000Z","end_date":"2017-11-29T18:30:00.000Z","industry":"Technology","sub_industry":"Technology","function":"Growth","domain":[],"current":false,"attachments":[],"_id":"69b65648ec2e5fba173652f5"},{"company":"69b656479197248ea1ab3a51","role":"Growth Marketing Consult","start_date":"2016-09-30T18:30:00.000Z","end_date":"2016-12-30T18:30:00.000Z","description":"Designed and Mapped the entire content marketing strategy across the funnel.\n\nThe strategy covered the following:\n\n ● Audience personas\n ● Audience needs\n ● Competitive research\n ● Content generation\n ● Distribution process\n ● Publication tracking process","industry":"Technology","sub_industry":"Software Development","function":"Marketing","domain":[],"current":false,"attachments":[],"_id":"69b65648ec2e5fba173652f6"},{"company":"69b656479197248ea1ab3a69","role":"Assistant Marketing Manager","start_date":"2011-02-28T18:30:00.000Z","end_date":"2012-03-30T18:30:00.000Z","description":"Key highlights of my job profile: \n\n● My Job was to create and manage marketing strategies. Pharma market in India is highly competitive and consists a lot of indirect marketing techniques \n \n●  Creating unique openings to consultants using unconventional marketing techniques. For example for children's d
