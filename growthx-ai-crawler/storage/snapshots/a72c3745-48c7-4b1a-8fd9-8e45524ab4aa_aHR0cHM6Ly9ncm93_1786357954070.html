anies."},{"summary":"Who is this CRAFT not for?","detail":"The learnings of this CRAFT won’t be applicable on products that are in early \u0026 pre-PMF stage. Essentially, companies where there is not a lot of data flowing in."},{"summary":"Who will I learn from?","detail":"The program director for Data Led Growth is Tanmay Nagori, Analytics lead at Tide. Over the last 9 years, he has built \u0026 led analytics teams at companies like CRED, Amazon \u0026 MuSigma. From leading insights for the largest category at Amazon to building the analytics team at CRED 0 to 1, he has distilled all that he has learned about turning data into insights \u0026 using it to create meaningful business impact into this CRAFT."},{"summary":"What is the project? And is it mandatory?","detail":"Yes, doing the project is mandatory. True learning doesn’t happen till you apply it. The only way CRAFTs work is when you apply it, i.e., do the project.\n\nThis project will help you understand the nuances behind running an experiment that generates continuous learnings. You will do 5 clear things:\n• Structure the experiment hypothesis in a way that drives clarity\n• Set the goal and success metrics for the experiment\n• Design the experiment to be run covering each and every nuance\n• Document learnings and next steps\n• Build a plan to align stakeholders and get buy-in"}]}},{"visibility":"PUBLIC","type":"SEO_METADATA","version":1,"content":{"ogImage":"https://public-cdn.growthx.club/learning-experience-products/local/brand-led-growth/brand-led-growth/9ac99bee86-CS Horizontal Thumbnail.png","ogTitle":"Data Led Growth","ogDescription":"This CRAFT is designed for folks in product, marketing \u0026 founders looking to drive exponential revenue impact through data \u0026 experimentation."}},{"visibility":"PUBLIC","type":"CURRICULUM","version":1,"content":{"modules":[{"_id":"659966cca141bb09cee6eb84","moduleId":"Introduction to the CRAFT","name":"Introduction to the CRAFT","subtitle":"Module 1","summ
