kia’s Series60 v3.1 and Symbian OS.\n• Managed team of 6 engineers and assisted Senior Management in planning requirements and driving execution.\n• Mainly involved in design and development of StartupSubSystem (SSY) interface which is responsible for the initialisation of\n  various components required during the device startup.\n• Design \u0026 Development of SHIM layer for Smartcard Module for legacy Freescale telephony hardware\n• Design \u0026 Development of test driver for Conference call APIs","industry":"Energy","sub_industry":"Semiconductor Manufacturing","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69b5c970f154cb7acf9b100e"},{"company":"6435b19ae884d1c06d62f834","role":"Software Engineer","start_date":"2002-12-31T18:30:00.000Z","end_date":"2006-12-30T18:30:00.000Z","description":"-Mainly responsible for the entire development life cycle from requirements to release, with a track record of delivering quality software for Nokia and Fujitsu mobile handsets using C++ and OOD.\n-I was chief point of contact between Offshore team(Bangalore) and Fujitsu(Japan) while working in Japan executing Camera migration and Performance improvement projects.Led and managed team of 12 engineers and QA.\n-This mainly involved gathering requirements,designing solutions and addressing technical clarifications to the teams.\n-Mentoring,training and ensuring faster ramp-up of fresh grads were my other contributions to Symbian Offshore Development Centre(ODC) during my stay at Satyam.\nProjects:\n• Performance Improvement of Fujitsu handsets based on Renesas Board (RB3)\n• Developed Mp3 Player UI and Middleware using S60/Symbian’s Multimedia Framework\n• Migrated Fujitsu Camera Engine to Symbian’s ECam API interface.\n• Developed Call Manager application using AlarmServer,Contacts,Location APIs on Symbian OS\n• Ported Symbian applications and middleware from v6.1 (EKA1) to 8.1b (EKA2)","industry":"Technology","sub_industry":"Software","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69b5c970f154cb7acf9b100f"},{"company":"65e802f16900383311635b05","role":"Software Engineer","start_date":"2002-12-31T18:30:00.000Z","end_date":"2005-12-31T18:30:00.000Z","employment_type":"","description":"-Mainly responsible for the entire development life cycle from requirements to release, with a track record of delivering quality software for Nokia and Fujitsu mobile handsets using C++ and OOD.\n-I was chief point of contact between Offshore team(Bangalore) and Fujitsu(Japan) while working in Japan executing Camera migration and Performance improvement projects.Led and managed team of 12 engineers and QA.\n-This mainly involved gathering requirements,designing solutions and addressing technical clarifications to the teams.\n-Mentoring,training and ensuring faster ramp-up of fresh grads were my other contributions to Symbian Offshore Development Centre(ODC) during my stay at Satyam.\nProjects:\n• Performance Improvement of Fujitsu handsets based on Renesas Board (RB3)\n• Developed Mp3 Player UI and Middleware using S60/Symbian’s Multimedia Framework\n• Migrated Fujitsu Camera Engine to Symbian’s ECam API interface.\n• Developed Call Manager application using AlarmServer,Contacts,Location APIs on Symbian OS\n• Ported Symbian applications and middleware from v6.1 (EKA1) to 8.1b (EKA2)","industry":"Professional Service","sub_industry":"IT Services and IT Consulting","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69e63442d18652cbc9d654bd"}],"social":{"linkedin":"https://www.linkedin.com/in/shubhangk","twitter":"","website":""},"display_picture":"https://du2l2d5icvsbf.cloudfront.net/USER/shubhang_vishwamitra_fe72b8d621/PROFILE_PHOTO/4141ba03a9-shubhang_vishwamitra_fe72b8d621.jpeg"},"company":{"_id":"66be4259b3781393d5a96fa2","url":"todoist.com","domain":[],"industry":"Professional Service","logo":"https://img.logo.dev/todoist.com?token=pk_RqfvqsxqSGSajjqEOE8sTQ","name":"Todoist","sub_industry":"Consultancy"},"editor_data":{"_id":"66be4259de6a216b143e24e3","identifier":"acquisition-project--|--todoist-66be4259de6a216b143e24e3","name":"Acquisition project  |  Todoist","type":"PROOF_OF_WORK","path":[{"name":"Acquisition","url":"/projects/64e61fea67ef9e05ef26a40d","_id":"66be4259de6a216b143e24e5"}],"visibility":"PUBLIC","banner":"https://du2l2d5icvsbf.cloudfront.net/editor/banner-1.webp","owner":"66b48e8d2b099cf15fcb0dda","access":{"66b48e8d2b099cf15fcb0dda":"VIEW","64eda27f2df2e0b2da9c1e9b":"EDIT","65cc9ae6a2e362863c5b395a":"EDIT","64424e0740ee3b3358e7988a":"EDIT"},"created_at":"2024-08-15T18:00:57.358Z","updated_at":"2025-06-24T06:52:39.737Z","__v":0,"data":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"💫 Elevator Pitch","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h1"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"\"Imagine a world where staying productive is not a chore, but a seamless part of your daily routine. ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"color: #DD2E44;","text":"Todoist","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" is a productivity app, designed for the modern knowledge worker, helps you manage tasks, collaborate effortlessly, and achieve your goals with ease. Whether you're juggling multiple projects or simply trying to stay on top of your daily to-dos, ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"Todoist","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" integrates with your favourite tools and provides real-time insights to keep you on track. Say goodbye to overwhelm and hello to a more organised, stress-free life. ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"color: #DD2E44;","text":"Welcome to the future of productivity","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"\"","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"⏰ Todoist","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h1"},{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Product Overview","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Todoist is a digital productivity app designed to help knowledge workers manage tasks, collaborate with teams, and stay organized in their personal and professional lives. It’s built to seamlessly integrate with other popular productivity tools, making it an essential part of the user’s workflow.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"2. Key Features:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h4"},{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Task Management:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Create, prioritise, and organise tasks into projects. Set deadlines, add labels, and assign tasks to team members.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Collaboration Tools:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Share projects and tasks with others, assign responsibilities, and communicate within the app to ensure everyone stays on the same page.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Integrations:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Connect with other productivity tools like Google Workspace, Slack, and Asana for a unified experience.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Productivity Tracking:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Gain insights into your productivity patterns, track progress over time, and identify areas for improvement.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":4},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Reminders and Notifications:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Stay on top of deadlines with customizable reminders and real-time notifications.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":5},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Cross-Platform Access:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Access your tasks and projects from any device, ensuring continuity no matter where you are.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":6},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Customization Options:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Tailor the app to your workflow with customizable themes, views, and shortcuts.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":7}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"3. What Problem is Todoist Solving?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h4"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Task Overload:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":" Many knowledge workers struggle with managing multiple tasks and projects, leading to stress and decreased productivity. Your app helps users organize and prioritize tasks, reducing overwhelm.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Lack of Collaboration Tools:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":" Traditional task management tools often lack robust collaboration features. Your app solves this by allowing users to share tasks, communicate, and collaborate within a single platform.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Disjointed Tools:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":" Users often have to juggle multiple productivity tools that don’t work well together. Your app solves this by integrating with other popular tools, providing a seamless experience.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Lack of Insights:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":" Users struggle to track their productivity and identify areas for improvement. Your app offers productivity tracking features that give users actionable insights.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"altText":"Forms response chart. Question title: Which features of Todoist do you use most frequently? (Check all that apply). Number of responses: 4 responses.","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACJQAAAQUCAYAAAAlANFaAAAAAXNSR0IArs4c6QAAIABJREFUeF7snXe8FEXWho85fOuuGHDXnDDnnEUJikRJCooJEFEMZAURCSogQRRJkg3krBIUBJWgomsAE6hrWHNeVzfo5/d7x29wurt6unvm3r4XeOof5U51VfXTp6srvHXOZr/++uuvRoIABCAAAQhAAAIQgAAEIAABCEAAAhCAAAQgAAEIQAACEIAABCAAAQhAAAIQgMD/E9gMQQm2AAEIQAACEIAABCAAAQhAAAIQgAAEIAABCEAAAhCAAAQgAAEIQAACEIAABCCQSwBBCfYAAQhAAAIQgAAEIAABCEAAAhCAAAQgAAEIQAACEIAABCAAAQhAAAIQgAAEIOAhgKAEg4AABCAAAQhAAAIQgAAEIAABCEAAAhCAAAQgAAEIQAACEIAABCAAAQhAAAIQ8BBAUIJBQAACEIAABCAAAQhAAAIQgAAEIAABCEAAAhCAAAQgAAEIQAACEIAABCAAAQh4CCAowSAgAAEIQAACEIAABCAAAQhAAAIQgAAEIAABCEAAAhCAAAQgAAEIQAACEIAABDwEEJRgEBCAAAQgAAEIQAACEIAABCAAAQhAAAIQgAAEIAABCEAAAhCAAAQgAAEIQAACHgIISjAICEAA eenshot_2024_08_17_at_4.34.26_PM.png","type":"image","version":1,"width":"inherit"},{"children":[{"detail":2,"format":0,"mode":"normal","style":"","text":"\t","type":"tab","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"Exhibit 4 : Referral is the biggest opportunity cost ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Todoist Referral Program Strategy","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h3"},{"type":"horizontalrule","version":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Objective:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h4"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"To design and implement a referral program that increases user acquisition through word-of-mouth marketing by incentivising current users to refer Todoist to their networks. The program will aim to capitalise on key moments in the user journey where satisfaction and engagement are high, driving organic growth through both direct referrals and partnerships.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"1. Why Would Anyone Refer Todoist?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h4"},{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Aha Moments \u0026 Happy Moments:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Identify key moments in the user journey where Todoist delivers significant value, such as completing a large project, achieving a productivity streak, or discovering a new feature that enhances their workflow. These moments are ideal for prompting users to share their experience with others.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Brag-Worthy Features:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Leverage features or achievements that users would want to share with their peers, such as completing 100 tasks or reaching a specific productivity milestone. Encourage users to share these accomplishments through social media or direct referrals.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Key Actions:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Conduct user journey mapping to identify Aha Moments.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Develop messaging that highlights these moments and integrates referral prompts.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"2. Do User Insights Support a Referral Program?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h4"},{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"User Research Insights:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Analyse user feedback, testimonials, and survey data to determine if there is an existing pattern of word-of-mouth referrals. If a significant portion of users discovered Todoist through friends or colleagues, this indicates a strong potential for a referral program.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Happy Moments Identification:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Use qualitative and quantitative data from user interactions to pinpoint the moments when users are most satisfied. These are the touchpoints where referral prompts should be strategically placed.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Key Actions:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Review user surveys and feedback for patterns indicating organic word-of-mouth referrals.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Align referral prompts with high-satisfaction moments in the user journey.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"3. Referral Rewards:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h4"},{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"For Existing Users (Referrers):","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Offer rewards that enhance the Todoist experience, such as free premium months, discounts on subscription renewals, or unlocking exclusive features.","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Consider monetary incentives, such as gift cards or cash rewards, but ensure these align with the brand and product goals.","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Introduce gamification elements like points, badges, or leaderboards to incentivize multiple referrals.","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":3}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"For New Users (Referees):","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Provide extended free trial periods (e.g., 30 days instead of 14 days) to new users who sign up through referrals.","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Offer a discount on their first premium plan purchase as an incentive for initial conversion.","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":2}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Key Actions:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Determine the most valuable rewards for both referrers and referees.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Implement a gamification strategy to motivate users to refer more frequently.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"4. Referral Flow Design:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h4"},{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Optimal Touchpoints:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Integrate referral prompts at key moments of user satisfaction, such as after completing a project or achieving a productivity streak. Avoid interrupting critical tasks, such as payments or focused work sessions.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Seamless Integration:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Ensure the referral process is easy and non-intrusive. Allow users to share referral links with one click, via email, social media, or messaging apps.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"User-Friendly Interface:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Design a clean and intuitive referral dashboard where users can track their referrals, rewards, and referral status.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Key Actions:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Use tools like Whimsical to create a flowchart mapping out the referral process.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Design the referral dashboard and ensure it integrates smoothly with the user experience.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":1,"mode":"normal","style"
