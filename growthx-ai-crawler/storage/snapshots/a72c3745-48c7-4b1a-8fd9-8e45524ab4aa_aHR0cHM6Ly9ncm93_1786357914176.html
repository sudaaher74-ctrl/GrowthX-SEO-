d - Growth","start_date":"2020-03-31T18:30:00.000Z","end_date":"2021-10-30T18:30:00.000Z","description":"Central growth team working across all business lines of Razorpay. (Payments, Capital \u0026 Banking)","industry":"Technology","sub_industry":"Information Technology","function":"Growth","domain":[],"current":false,"attachments":[],"_id":"69b65648ec2e5fba173652ee"},{"company":"65e614ed6900383311358031","role":"Product","start_date":"2019-10-01T00:00:00.000Z","end_date":"2020-04-01T00:00:00.000Z","employment_type":"Full-time","description":"I transitioned to the Product function to setup the first product growth team at Razorpay. The team built product capabilities that drove growth. from segmentation services, campaign api, to product led sales.","industry":"Technology","sub_industry":"Software Development","function":"Product","domain":[],"current":false,"attachments":[],"_id":"69dbaa0eb3d0ee0d68755065"},{"company":"63f0a45d25c50aeec142fabe","role":"Product","start_date":"2019-09-30T18:30:00.000Z","end_date":"2020-04-29T18:30:00.000Z","description":"I transitioned to the Product function to setup the first product growth team at Razorpay. The team built product capabilities that drove growth. from segmentation services, campaign api, to product led sales.","industry":"Technology","sub_industry":"Information Technology","function":"Founder","domain":[],"current":false,"attachments":[],"_id":"69b65648ec2e5fba173652ef"},{"company":"63f70aab13f07773dc332f93","role":"GrowthX Community","start_date":"2019-04-30T18:30:00.000Z","end_date":"2021-10-30T18:30:00.000Z","description":"We started GrowthX community as a side hustle to solve our own paint point.\n\nMore contexy 👇\n\nAll communities that existed were primarily made for folks to help them crack their first job. However, being in mid-senior roles, Udayan at Razorpay and Abhishek at CRED, they wanted a close nit community of operators \u0026 founders who they can learn from. They wanted to soundboard, brainstorm \u0026 ideate on growth problems. \n\nWe realised that as we grew in our careers, the journey became more and more lonely. To solve this, we started our own community called GrowthX. But we didn’t like the way current communities were setup. We felt they were too superficial. We did not want to connect with 100s of folks and talk about random things.\n\nSo we created a different kind of a community– a learning community. The insight was that we truly bond with people who we problem solve with. So, every week we selected 6-8 people, these folks would look at their own company's problem statement and solve it using a Harvard case study format.\n\nOver the 2 years, we built a super strong community of 300 folks. We never wanted to become a large community just for the sake of a vanity number. Our community is characterized by people who keep in touch, who solve problems together, and who form lasting connections.\n\nOver those 2 years, our community asked for longer, more structured version of our meetups- so we launched a 5 week program that teaches folks everything from acquisition, onboarding, engagement, retention \u0026 monetization.\n\nWe got sold out in 23 hours. And the rest is history.","industry":"Education","sub_industry":"Edtech","function":"Founder","domain":[],"current":false,"attachments":[],"_id":"69b65648ec2e5fba173652f0"},{"company":"65e614ed6900383311358031","role":"Product Marketing Manager 2","start_date":"2019-02-01T00:00:00.000Z","end_date":"2019-10-01T00:00:00.000Z","employment_type":"Full-time","description":"First product marketing manager for platform product.","industry":"Technology","sub_industry":"Software Development","function":"Marketing","domain":[],"current":false,"attachments":[],"_id":"69dbaa0eb3d0ee0d68755067"},{"company":"63f0a45d25c50aeec142fabe","role":"Product Marketing Manager 2","start_date":"2019-01-31T18:30:00.000Z","end_date":"2019-10-30T18:30:00.000Z","description":"First product marketing manager for platform product.","in
