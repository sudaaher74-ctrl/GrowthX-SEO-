dules":["67f0ef3c1b6226f8af153ed7","67f0ef630f4fdef0bc66f05d","67f0efc5a28ad329906ce656","67f0f03c1b6226f8af1545ad"],"type":"LX","free_preview_modules":[],"cover_photo":"https://public-cdn.growthx.club/product_images/production/storytelling/cover_photo/85edbb229b-ART_of_Storytelling-s.png","subtitle":" Learn the art \u0026 science of crafting stories that create emotional connect and drive business impact","active":true,"video_url":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/trailer/899524fe02-Trailer storytelling v10 compressed.mp4","total_modules":12,"duration":7101,"landing_page":{"_id":"67f4d5557d0fa969ca092c67","key":"storytelling","type":"CRAFT","status":"LIVE","product_id":"67f0ebf7a28ad329906cca55","flow":{"with_card":[{"visibility":"PUBLIC","type":"HERO_SECTION","version":1,"content":{"title":"Storytelling","description":"Great brands aren’t just built on exceptional products — they’re driven by powerful stories. Learn the art \u0026 science of crafting stories that create emotional connections and drive lasting business impact.","aboutProduct":"Whether you're building a brand, launching a campaign, or bringing new products and features to the market, your ability to craft the right narrative determines how well your message lands.\n\nToday, your audience is bombarded with content from all directions—ads, social media, blogs, emails. And with so much noise, your story needs to stand out. This CRAFT will teach you just that. You’ll dive deep into understanding your user’s needs, uncovering insights, and building narratives that grab attention \u0026 drive real business impact.","builtFor":[{"icp":"MARKETING \u0026 BRAND LEADERS","description":"Whether you're leading a marketing team or setting brand strategy, you'll gain actionable insights into crafting compelling stories that build trust, land with your users \u0026 drive business growth."},{"icp":"FOUNDERS","description":"Craft a brand story that communicates your vision and aligns with your growth strategy. This CRAFT will help you understand users, gather insights \u0026 craft a narrative that aligns with your business goals."},{"icp":"CURIOUS FOLKS","description":" If you're just who's starting to tinker with marketing, or if storytelling excites you, this CRAFT is for you. It dives deep into understanding your users and crafting stories with a solid narrative."}],"short_trailer":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/trailer/de9e676ef7-short trailer compressedd.mp4"}},{"visibility":"PUBLIC","type":"SEO_METADATA","version":1,"content":{"ogImage":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/e7755c8a15-Storytelling Horizontal Thumbnail.png","ogTitle":"Learn Storytelling from Apple Marketing Leader | GrowthX","ogDescription":"Former Apple marketing leader \u0026 CMO, Allen teaches you the art of storytelling that can change your career trajectory."}},{"visibility":"PUBLIC","type":"ENROLL_CARD_LIST","version":1,"content":{"features":[{"text":"Cinematic learning experience","icon":"https://public-cdn.growthx.club/media/signup/module-icon.png"},{"text":"Access 100+ member projects","icon":"https://public-cdn.growthx.club/media/signup/cube.png"},{"text":"Learn at your own pace","icon":"https://public-cdn.growthx.club/media/signup/clock.png"}]}},{"visibility":"PUBLIC","type":"PROGRAM_DIRECTOR","version":1,"content":{"name":"Apoorv Sharma","tagline":"Marketing leader | Apple, Amazon, Flipkart","description":"Over the past 2 decades, I have led marketing efforts in leadership roles across some of the most loved brands like Apple, Amazon, and Flipkart.\n\nMy journey began at Vodafone. I then joined Amazon, where I grew the publisher base for Native Shopping Ads by 10x in just 18 months. Leading me to Apple, where I scaled their market share in India from 1% to 12%, redefining their digital-first strategy in the country.\n\nStorytelling has been at the core of my career — it's what shapes us as humans and is essential for brand building. Iconic brands are built on the foundation of great stories, and in this CRAFT, we'll focus on storytelling from the lens of a product launch.\n\nI’ve distilled my experiences into one actionable storytelling framework, where we’ll dive deep into understanding your users— something most people overlook. We’ll then turn your research into insights and craft a compelling narrative to tell your story.  ","photo":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/db33fa377c-Frame 1171275759.png","logos":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/8105f9f2e4-Logo strip white.png","avatar":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/5a234ccc55-profile.png"}},{"visibility":"PUBLIC","type":"CURRICULUM","version":1,"content":{"modules":[{"summary_icon":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/d055329b1b-Frame 1171276212.png","name":"Introduction to Storytelling","sub_modules":[{"name":"Core outcomes from the CRAFT","description":"Dive into the art \u0026 science of great storytelling. You'll learn how to set clear goals, conduct research, extract meaningful insights, and build narratives that resonate with your users."},{"name":"Introduction to Storytelling","description":"Discover how a strong narrative sets the foundation for iconic brands \u0026 campaigns. Dive into how effective storytelling directly impacts your acquisition, engagement, and retention metrics. "},{"name":"Storytelling gone wrong ","description":"Look at real-world examples where storytelling failed to deliver results. We'll break down campaigns that looked creative but failed to deliver on customer connection and business impact. "}]},{"summary_icon":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/c78725f157-Frame 1171276212.png","name":"The framework to Storytelling","sub_modules":[{"name":"Step 1: Defining the goal","description":"Start off by understanding what part of the funnel you’re targeting and define your goal using the XYZ framework. "},{"name":"Step 2: User \u0026 market research","description":"With your goal set in place, dive into the types of research and how to conduct it. Learn the decision framework to choose the type of research suited for your use case."},{"name":"Step 3: Translating research into insights","description":"Turn your research into actionable insights by identifying user behaviour and feedback. Extract the core theme that will form the base of your narrative."},{"name":"Step 4: Crafting your brand narrative ","description":"Build stories centered on your user’s pain points and desires. Choose the right keywords, pick the right appeal and implement visual storytelling principles."}]},{"summary_icon":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/499f544cee-TWT.png","name":"The Whole Truth: Whey protein ","sub_modules":[{"name":"Understanding users and market","description":"See how The Whole Truth identified skepticism in the protein powder market and crafted their story by deeply understanding different user segments and aligning it to the market opportunity. "},{"name":"Generating insights from research","description":"Understand how TWT uncovered key insights about transparency, health concerns, and product expectations. Learn how they identified their core theme and validated it. "},{"name":"Building the brand narrative","description":"Dive into how they differentiated their messaging for different user segments and designed a visual identity that reinforced their \"nothing to hide\" positioning. "}]},{"summary_icon":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/2438257e34-fk.png","name":"Flipkart: Bringing Indian sellers online","sub_modules":[{"name":"Conducting user, market \u0026 product research","description":"Discover how Flipkart's approach to understanding traditional family businesses \u0026 competitive validation shaped their strategy to onboard 70,000 new sellers."},{"name":"Generating insights from the research","description":"Understand Flipkart’s process of uncovering generational dynamics in family-owned businesses and how these cultural insights influenced their storytelling approach."},{"name":"Building the brand narrative","description":"Dive into how Flipkart crafted it’s narrative and arrived at the core theme for their campaign. "}]}]}},{"visibility":"PUBLIC","type":"ENROLL_CARD_LIST","version":1,"content":{"features":[{"text":"Access 100+ member projects","icon":"https://public-cdn.growthx.club/media/signup/cube.png"},{"text":"Learn at your own pace","icon":"https://public-cdn.growthx.club/media/signup/clock.png"}]}},{"visibility":"PUBLIC","type":"LEARNING_SECTION","version":1},{"heading":"FAQ","visibility":"PUBLIC","type":"FAQ","version":1,"content":{"faqs":[{"summary":"What will I learn in this course?","detail":"In this CRAFT, you will learn how to craft compelling stories that connect with your audience and drive real business outcomes.\n\nYou’ll leave with 4 core learning outcomes:\n\n- Conduct short-term \u0026 long-term research to gather insights.\n- Turn your research into clear and actionable user insights.\n- Build a strong core theme for your story.\n- Adapt the story across different formats and channels."},{"summary":"Who is this CRAFT for?","detail":"This CRAFT is tailored for marketers, brand leaders, and founders gearing up for a product, feature or campaign launch. If you're looking to tell the right story for your brand, this will help you connect with your audience. \n\nThat said, even if you're not working on a launch but are curious about storytelling, you'll still walk away with actionable insights. "},{"summary":"Who is this CRAFT not for?","detail":"This CRAFT is not meant for those who are not yet ready to apply storytelling to real-world scenarios like that of a product/feature/campaign launch. \n\nIf you're still in the very early stages of your brand or product development and don't yet have customer insights or data, this may not be the right course for you."},{"summary":"Who will I learn from?","detail":"The program director for the CRAFT of Storytelling is Apoorv Sharma, former marketing leader at Apple India, with over 20 years of experience across brands like Apple, Amazon, Flipkart, and Vodafone.\n\nStorytelling has been at the core of Apoorv's - it's what shapes each of us and forms the backbone of iconic brands. \n\nHe has distilled his years of experience and expertise leading marketing for these brands into this CRAFT where he'll teach you how to really understand your users, turn research into insights, build a strong narrative and adapt it across channels. "},{"summary":"What is the project?\n","detail":"CRAFTs are not meant to be consumed like a Netflix film. True learning doesn’t happen till you apply it. The only way CRAFTs work is when you apply what you learn, i.e. build the project.\n\nThe project has 4 core sections:\n\n1. Picking a problem statement and conducting short-term research to understand your users. \n2. Turn your research into actionable insights that drive your story. \n3. Build a strong core theme and narrative for your story. \n4. Develop a distribution plan for your launch. "}]}},{"visibility":"PUBLIC","type":"OUTCOME_SLIDER","version":1,"content":{"outcomes":[{"title":"Ask the right questions","description":"Learn to conduct user research and probe your users for deeper insights. Choose between a long term vs short term research strategy. This is the most crucial step and will lay the foundation for your story's narrative."},{"title":"Turn research into insights.\n","description":"Distill raw research data into clear, actionable insights. Learn how to identify patterns, pain points, and desires to fuel your narrative and make it more relatable to your audience.\n\n"},{"title":"Build a compelling core theme.\n","description":"Take the insights insights you've gathered and mold them into a core theme that drives your story. This is where your brand’s heart and message come together."},{"title":"Adapt your story across formats and channels.","description":"Tailor your narrative across formats and channels to tell your story to the world. "}]}},{"visibility":"PUBLIC","type":"PROJECT_SLIDER","version":1}],"without_card":[{"visibility":"PUBLIC","type":"HERO_SECTION","version":1,"content":{"title":"Storytelling","description":"Great brands aren’t just built on exceptional products — they’re driven by powerful stories. Learn the art \u0026 science of crafting stories that create emotional connections and drive lasting business impact.","aboutProduct":"Whether you're building a brand, launching a campaign, or bringing new products and features to the market, your ability to craft the right narrative determines how well your message lands.\n\nToday, your audience is bombarded with content from all directions—ads, social media, blogs, emails. And with so much noise, your story needs to stand out. This CRAFT will teach you just that. You’ll dive deep into understanding your user’s needs, uncovering insights, and building narratives that grab attention \u0026 drive real business impact.","builtFor":[{"icp":"MARKETING \u0026 BRAND LEADERS","description":"Whether you're leading a marketing team or setting brand strategy, you'll gain actionable insights into crafting compelling stories that build trust, land with your users \u0026 drive business growth."},{"icp":"FOUNDERS","description":"Craft a brand story that communicates your vision and aligns with your growth strategy. This CRAFT will help you understand users, gather insights \u0026 craft a narrative that aligns with your business goals."},{"icp":"CURIOUS FOLKS","description":" If you're just who's starting to tinker with marketing, or if storytelling excites you, this CRAFT is for you. It dives deep into understanding your users and crafting stories with a solid narrative."}]}},{"visibility":"PUBLIC","type":"PROGRAM_DIRECTOR","version":1,"content":{"name":"Apoorv Sharma","tagline":"Marketing leader | Apple, Amazon, Flipkart","description":"Over the past 2 decades, I have led marketing efforts in leadership roles across some of the most loved brands like Apple, Amazon, and Flipkart.\n\nMy journey began at Vodafone. I then joined Amazon, where I grew the publisher base for Native Shopping Ads by 10x in just 18 months. Leading me to Apple, where I scaled their market share in India from 1% to 12%, redefining their digital-first strategy in the country.\n\nStorytelling has been at the core of my career — it's what shapes us as humans and is essential for brand building. Iconic brands are built on the foundation of great stories, and in this CRAFT, we'll focus on storytelling from the lens of a product launch.\n\nI’ve distilled my experiences into one actionable storytelling framework, where we’ll dive deep into understanding your users— something most people overlook. We’ll then turn your research into insights and craft a compelling narrative to tell your story.","photo":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/db33fa377c-Frame 1171275759.png","logos":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/91f824e8ab-Group 1171276519.png","avatar":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/4b8b1860d0-DSC04878 1.png"}},{"visibility":"PUBLIC","type":"CURRICULUM","version":1,"content":{"modules":[{"summary_icon":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/d055329b1b-Frame 1171276212.png","name":"Introduction to Storytelling","sub_modules":[{"name":"Core outcomes from the CRAFT","description":"Dive into the art \u0026 science of great storytelling. You'll learn how to set clear goals, conduct research, extract meaningful insights, and build narratives that resonate with your users."},{"name":"Introduction to Storytelling","description":"Discover how a strong narrative sets the foundation for iconic brands \u0026 campaigns. Dive into how effective storytelling directly impacts your acquisition, engagement, and retention metrics. "},{"name":"Storytelling gone wrong ","description":"Look at real-world examples where storytelling failed to deliver results. We'll break down campaigns that looked creative but failed to deliver on customer connection and business impact. "}]},{"summary_icon":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/c78725f157-Frame 1171276212.png","name":"The framework to Storytelling","sub_modules":[{"name":"Step 1: Defining the goal","description":"Start off by understanding what part of the funnel you’re targeting and define your goal using the XYZ framework. "},{"name":"Conducting user and market research","description":"With your goal set in place, dive into the types of research and how to conduct it. Learn the decision framework to choose the type of research suited for your use case. "},{"name":"Translating research into actionable insights","description":"Turn your research into actionable insights by identifying user behaviour and feedback. Extract the core theme that will form the base of your narrative. "},{"name":"Crafting your brand narrative","description":"Build stories centered on your user’s pain points and desires. Choose the right keywords, pick the right appeal and implement visual storytelling principles. "}]},{"summary_icon":"https://public-cdn.growthx.club/learning-experience-products/production/storytelling/storytelling/9822bd4c2d-twtt.png","na
