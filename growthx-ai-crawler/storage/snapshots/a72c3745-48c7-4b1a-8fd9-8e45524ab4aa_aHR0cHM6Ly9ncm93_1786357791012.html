 \u0026 unhealthy regions","industry":"Technology","sub_industry":"Software Development","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69b60356f154cb7acf9d7ae9"},{"company":"679110eb4421e85f8d35845b","role":"Graduate Data Scientist","start_date":"2021-07-31T18:30:00.000Z","end_date":"2022-11-29T18:30:00.000Z","description":"I worked in the Advanced Analytics \u0026 Artificial Intelligence team at ATKINS. I've been a part of numerous crucial projects and performed the following duties:\n\n1. Led a cross-functional team of 3 in manually annotating 45K+ pavement images (in less than 6 weeks) through Azure Labeling\n2. Communicated experienced pain points on Azure labeling to Microsoft team, leading to the deployment of 3 impactful features\n3. Built AI model for pavement distress detection along client requirements, reducing their inspection time by 50%\n4. Centralized data repository for Decarbonomics Net Zero service platform by setting up stored procedures\n5. Communicated with stakeholders to deliver Criticality modelling tool using Python, saving 100% manual effort\n6. Supported the maintenance of already existing tools on R. Enhanced output visualizations \u0026 aesthetics using ggplot in R\n\nBesides this, I also actively volunteer to engage the team through collaboration and fun activities!","industry":"Professional Service","sub_industry":"Engineering Services","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69b60356f154cb7acf9d7aea"},{"company":"69b6033efa092df3bc6dcea2","role":"President","start_date":"2020-03-31T18:30:00.000Z","end_date":"2021-06-29T18:30:00.000Z","description":"The role required me to uphold the enthusiasm of my faction thereby bringing the best out of every member. It has also allowed me to take several initiatives- that went too far in establishing EAGE RGIPT as the youngest yet the fastest growing student societies at RGIPT.  I have gradually learnt about diverse approaches that have helped me evolve as a leader and shaped me into a responsible individual.\n\n1. Strategized team expansion, increased growth by 130%. Launched Instagram page, extended reach by 200%\n2. Led designers \u0026 writers to strategize content roadmap for social media, leading to 500% increased audience\n3. Ideated, coordinated \u0026 executed 15+ events tailored to students needs that boosted team engagement by 150%\n4. Enhanced cross-campus collaboration by organizing \u0026 featuring an event in DEW Journal (1500+ mo. visitors)\n5. Bestowed the L. Austin Weeks grant (first insti. chapter to receive $500) in recognition of extraordinary growth","industry":"Energy","sub_industry":"Oil and Gas","function":"Founder","domain":[],"current":false,"attachments":[],"_id":"69b60356f154cb7acf9d7aeb"},{"company":"69b6033efa092df3bc6dce79","role":"Modern Physics Tutor","start_date":"2019-12-31T18:30:00.000Z","end_date":"2020-03-30T18:30:00.000Z","description":"Conducting weekly tutorials for a batch of 35 freshmen. Teaching, evaluating and helping them with the course.","industry":"Energy","sub_industry":"Oil and Gas","function":"Marketing","domain":[],"current":false,"attachments":[],"_id":"69b60356f154cb7acf9d7aec"},{"company":"65e6efe969003833114851ea","role":"Winter Trainee","start_date":"2019-11-30T18:30:00.000Z","end_date":"2020-01-30T18:30:00.000Z","description":"Sand production is a common problem associated with the extraction of oil. I was fortunate to work at the Sand Control Laboratory of the Institute of Oil and Gas Production Technology (IOGPT), ONGC as a part of my winter training. During the training period, I \n\n1. Studied various Sand Control Methods. Performed Sieve Analysis of Formation Sand from three different wells to estimate Gravel Pack Size and Screen Size on Excel.\n2. Performed Hydraulic Fracturing simulations for three different wells, using FIELDPRO Software.\n3. Analyzed fracture profile and studied the effect of different parameters on it","industry":"Energy","sub_industry":"Oil and Gas","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69b60356f154cb7acf9d7aed"},{"company":"69b6033ffa092df3bc6dcff2","role":"Laurie Dake Challenge","start_date":"2019-11-30T18:30:00.000Z","end_date":"2020-01-30T18:30:00.000Z","description":"I lifted the spirits of my fellow batchmates and some seniors to participate in the Laurie Dake Challenge organized by EAGE. I enthusiastically facilitated the selection of two teams from RGIPT for the Laurie Dake Challenge and with full determination, led a team of 5 to accomplish the following objectives:\n\n1. Analyzed the log data for the 6305/5-1 well of the Ormen Lange field, Norway using ZetaLog 3.8 and MS-Excel.\n2. Detected gas zones, estimated porosity of the formation \u0026 density of the reservoir gas at the depth of interest.\n3. Performed horizon and fault picking of the seismic section on Kingdom software. Spotted depositional features, bright and flat spots based on Seismic Interpretations","industry":"Energy","sub_industry":"Oil and Gas","domain":[],"current":false,"attachments":[],"_id":"69b60356f154cb7acf9d7aee"},{"company":"69b6033efa092df3bc6dce79","role":"Professional Communication Tutor","start_date":"2019-07-31T18:30:00.000Z","end_date":"2019-11-29T18:30:00.000Z","description":"Appointment as the tutor for Professional Communication helped me lucidly present ideas to a batch of 35 freshmen, thereby compelling them to put Professional Communication (both oral \u0026 written) in practice.","industry":"Energy","sub_industry":"Oil and Gas","function":"Marketing","domain":[],"current":false,"attachments":[],"_id":"69b60356f154cb7acf9d7aef"},{"company":"65e61d166900383311366298","role":"Summer Research Intern","start_date":"2019-04-30T18:30:00.000Z","end_date":"2019-07-30T18:30:00.000Z","description":"Summers of 2019, I had the privilege to join the Gas Hydrate Lab at IIT Madras (one among the premier research Institutes of India) under the guidance of Dr. Rajnish Kumar and Dr. Omkar Kushwaha, where I witnessed the complications arising from hydrate blockage of pipelines in the oil \u0026 gas industry. With the help of my mentor, I \n\n1. Performed a literature review to identify some novel \u0026 benign Kinetic Hydrate Inhibitors (KHIs).\n2. Designed experiments, estimated performance metrics to investigate the potential of identified KHIs\n3. Discovered that newly identified gas hydrate inhibitors outperformed state of the art by 133% at 0.5 wt% conc.","industry":"Education","sub_industry":"Higher Education","function":"Growth","domain":[],"current":false,"attachments":[],"_id":"69b60356f154cb7acf9d7af0"},{"company":"69b6033efa092df3bc6dcea2","role":"Secretary","start_date":"2018-11-30T18:30:00.000Z","end_date":"2020-04-29T18:30:00.000Z","description":"I orchestrated various events including ‘Geoquest’- aimed at sparking the interest of participants in geosciences \u0026 ‘Envi-challenge’- an intercollegiate event focused on assembling scientific approaches to combat Climate Change. I spearheaded the team to establish a healthy conversation with industry professionals by conducting different guest lectures.","industry":"Energy","sub_industry":"Oil and Gas","function":"Founder","domain":[],"current":false,"attachments":[],"_id":"69b60356f154cb7acf9d7af1"},{"company":"69b60356fa092df3bc6dd284","role":"Public Relations Coordinator","start_date":"2018-06-30T18:30:00.000Z","end_date":"2019-07-30T18:30:00.000Z","description":"1. With the virtue of good communication skills, I helped the chapter enhance participation in various events held. \n2. Conducting Interviews with some Industry professionals and ONGC placed undergraduates. \n3. Helped organizing the smooth conduction of various Guest Lectures held during the term.","industry":"Energy","sub_industry":"Oil and Gas","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69b60356f154cb7acf9d7af2"},{"company":"69b6033ffa092df3bc6dcf4 ormal","style":"","text":"3. You'll see the following screen on clicking \"Refer a friend\"","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"children":[],"direction":null,"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://public-cdn.growthx.club/USER/amir_memon_88fece5a3b/EDITOR/MEDIA/672617e55f-image.png","type":"image","version":1,"width":"inherit"},{"detail":0,"format":0,"mode":"normal","style":"","text":"After selecting the card above","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"children":[],"direction":null,"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://public-cdn.growthx.club/USER/amir_memon_88fece5a3b/EDITOR/MEDIA/57bfac8cb1-image.png","type":"image","version":1,"width":"inherit"},{"detail":0,"format":0,"mode":"normal","style":"","text":"How it Works","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"children":[],"direction":null,"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://public-cdn.growthx.club/USER/amir_memon_88fece5a3b/EDITOR/MEDIA/95095510e4-image.png","type":"image","version":1,"width":"inherit"},{"detail":0,"format":0,"mode":"normal","style":"","text":"Whatsapp link","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"children":[],"direction":null,"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://public-cdn.growthx.club/USER/amir_memon_88fece5a3b/EDITOR/MEDIA/1f138c0a3f-image.png","type":"image","version":1,"width":"inherit"},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":null,"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Some Hypotheses and experiments to improve the Referral program:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h3"},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Introduce the referral pop-up after happy flows/ Aha moments. e.g. An Activated User Gives full rating to a group workout. Introducing an in-app pop-up card that says, ","type":"text","version":1},{"detail":0,"format":10,"mode":"normal","style":"","text":"\"Enjoying Cult! Refer your friends and earn benefits worth more than Rs 500\"","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Since cult memberships are usually 14-15 months long, considering the extension from the offer. Addition of extra 15 days in membership doesn’t really create the picture of a great reward in the mind of the user. ","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"Suggestion","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":": Make changes to the referral copy and quantify the value of the reward better. Give more options for users to choose their reward from. Currently, the platform currency cult is using is their subscription, unless the subscription is about to end, user won't value the addition of 15 days in the subscription. The copy can say ","type":"text","version":1},{"detail":0,"format":9,"mode":"normal","style":"","text":"\"Choose a Reward worth more than Rs 500\"","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" and the options can be:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Extension in the current subscription by 15 days","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Flat Rs 500/- off on purchasing from Cult store. Min order value Rs 2000","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Additional Rs 500/- off on CultPlay \u003cThis can be substituted with any complementary plan they haven't subscribed to\u003e","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":3}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"The current message is basic and less exciting. Make changes in the copy \u0026 messaging, make the tone of the message more friendly. Something like you’d actually talk to your friend. e.g.","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":10,"mode":"normal","style":"","text":"\"Aman (Referrer's name) gave you Rs 500/- to start your fitness journey with Cultpass\"","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Expand the channel of messaging from WhatsApp to others. Since, cult is one of the frequent points of discussion amongst colleagues especially in cities like Bangalore, Hyderabad, Mumbai, etc. While Referring cult to your colleagues, Whatsapp might not be the best channel always. Hence instead of just WhatsApp, add more common  and easy to use ways like- ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"Copy the message along with referral link","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" so that user can paste it on a personal chat in Slack/ Discord/ Google Chat/ Microsoft Teams, etc.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":4}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":" ","type":"text","version":1}],"direction":null,"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Conclusion","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h1"},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"One of the strengths of Cult.fit includes it's diverse range of solutions across the entire fitness industry","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"We discussed how, Cult's products and offerings are a great fit for all kinds of ICPs, right from someone looking for building muscle to someone trying to stay active through a variety of different workout formats.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Undoubtedly, Cult is leading India's fitness space and has a strong offline positioning as compared to some of the other competitors. As cult expands to more and more cities, the SAM keeps growing ($ 5 Billion)","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"The User Research survey pointed out some interesting insights:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":4},{"children":[{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"All the survey participants, first heard about Cult through a friend/ Colleague. (Indicating WOM is extremely strong for a product like Cult)","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"54% of the participants, signed up for a trial class and decided to purchase the subscription later.","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"15.4% of the participants were referred by a friend or colleague, and","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"another 15.4% purchased the subscription, because their company offered it at a discounted price.","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":4},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Thus, Trial Class, Referrals and Corporate Plans are some of the top acquisition channels for Cult","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":5}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":5},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"After carefully examining the Google \u0026 Youtube search results, as part of organic channels, SEO. and Google map results can be improved to capture existing demand as pointed above along with improving ad copies for sponsored listings on YouTube.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":5},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"An important suggestion is to also put up some organic content for the city's best Cult Gyms/ Fitness centres to capture the existing demand coming from search queries like \"Best Gyms in Bangalore\"","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":6},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Referral from friends/ colleagues channel is underutilised at the moment. Recommended experiments can be performed to track the increase in acquisition from the redesigned referral programme. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":7}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":null,"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":null,"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":null,"format":"","indent":0,"type":"paragraph","version":1},{"chi
