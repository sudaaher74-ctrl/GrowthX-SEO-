e":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Go wild and dive deep—we love well-researched documents that cover all bases with depth and understanding.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""}],"format":"","indent":0,"type":"callout-content","version":1}],"format":"","indent":0,"type":"callout-container","version":1,"backgroundColor":"1"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Elevator Pitch","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h1"},{"children":[{"detail":0,"format":2,"mode":"normal","style":"","text":"(Think of this as an introduction to your product- make it remarkable!)","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Moj is a short-form video app that empowers millions of creators to showcase their talent and stories in under a minute. From Hindi to Tamil, Bengali, and more, Moj ensures you can enjoy and consume content in your mother tongue. With a vibrant community and a wide array of tools, effects, and music tracks, Moj offers an immersive platform for users to express themselves, connect with others, and discover new trends—all while celebrating the diversity and energy of India.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Understand your Product","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h1"},{"children":[{"detail":0,"format":2,"mode":"normal","style":"","text":"(Before you begin, you need to know what your product is, what are its features, what is the problem being solved by your product?)","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"background-color: #2F2F2F;","text":"Brief Introduction ","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"1. Description:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Moj- Indian Short Form Video Application","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"2. Launch: ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"2020 ","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"3. Users: ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"160 Mn+ MAU ","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"4. Company Stage: ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"Mature Scaling ","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"background-color: #2F2F2F;","text":"What Problem does your product solve?","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"Social Media Alienated Bharat: ","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"Popular Social media networks like Facebook, Twitter, Instagram, Snapchat etc. were all foreign entities that predominantly hosted content in English. Their user base consisted of young urban audiences that mainly conversed in English on a regular basis. This language and nature of content alienated a large part of India (~70%) that resides in Tier 2 and Tier 3 cities and prefers to talk in their native language. ","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"Moj solved this problem by launching in 15+ regional languages across Hindi, Tamil, Telugu, Bengali etc., allowing users to consume and create relatable content in their mother tongues. Moj captures the nuances and diversity of India while offering entertainment on the go.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"background-color: #2F2F2F;","text":"Product Features","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"Users can watch, create and earn on Moj! The Feed is divided into 2 - Following and For You. ","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"Following Feed ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"only hosts videos from the creators you have followed. ","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"For you feed i","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"s dynamic and is suggested by the algorithm depending on genre of videos watched, watch time, engagement etc.","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"background-color: #2F2F2F;","text":"Core Features: ","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"1.  ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"WATCH","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":": Explore audio-video across different genres, categories, and languages of your choice. (first position on the bottom) . While watching users can like, share, comment and save the video. Users can also directly go to the creators page to follow them and check out the music used from the music library. There is also a gifting option under the Following Feed (where users can send moj coins to creators they follow and like) ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"CREATE","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":": Be it dance, Fashion, or education- one can create all sorts of videos and edit them on Moj. (Create button in the central position). Users are encouraged to use lenses from the tray, or use trending music from the library and create videos. ","type":"text","version":1},{"type":"linebreak","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"LIVE","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":": Express and engage in real time with Moj's Live feature! Create a special and stronger bond with your viewers and much more. (Live Button in the fourth position) ","type":"text","version":1},{"type":"linebreak","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":" ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"EARN","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":": Earn with virtual gifting, referral program, and daily challenges   ","type":"text","version":1},{"type":"linebreak","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":4},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Home : ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"Your profile and all the content you've created is hosted under this. (5th button) ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":5}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":2,"tag":"ol"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"background-color: #2F2F2F;","text":"Core Product Flows","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #F2F2F2;","text":"1. Setting Up Your Account (via Facebook, Google, Apple or Phone Number) ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragra  AIX flights)  to provide in-flight entertainment while commuting  in Tier 2 \u0026 3 cities","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Why Moj and Airflix? ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":1,"textStyle":""},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Moj is an Indian short form video app. People use the app mostly to consume quick content in their native language. During travel, users tend to scroll through SFV platforms a lot to pass their time. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Additionally, Moj can enrich the flyers experience by showing them food/travel/entertainment content of the city they are going to travel to and fro. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Here is the flow of working:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Discovery","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":":","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1}
