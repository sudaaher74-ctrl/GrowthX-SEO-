","description":"Business Intelligence | Tableau | SAP BO","industry":"Professional Service","sub_industry":"IT Services and IT Consulting","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69e620d6d18652cbc9d58a4a"}]},"company":{"_id":"6669569537111f0c7879c878","url":"superbottoms.com","domain":[],"industry":"Online","logo":"https://img.logo.dev/superbottoms.com?token=pk_RqfvqsxqSGSajjqEOE8sTQ","name":"SuperBottoms","sub_industry":"E-commerce"},"editor_data":{"_id":"666956958b147e0e4e99fecd","identifier":"onboarding-project--|--superbottoms-666956958b147e0e4e99fecd","name":"Onboarding project  |  Superbottoms","type":"PROOF_OF_WORK","path":[{"name":"Onboarding","url":"/projects/64e61fea67ef9e05ef26a40e","_id":"666956958b147e0e4e99fecf"}],"visibility":"PUBLIC","banner":"https://du2l2d5icvsbf.cloudfront.net/editor/banner-2.webp","owner":"661a301ef38fbc6b434e84be","access":{"661a301ef38fbc6b434e84be":"VIEW","64eda27f2df2e0b2da9c1e9b":"EDIT","65cc9ae6a2e362863c5b395a":"EDIT","64424e0740ee3b3358e7988a":"EDIT"},"created_at":"2024-06-12T08:04:37.889Z","updated_at":"2025-06-24T06:52:39.737Z","__v":0,"data":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"background-color: #413F3F;","text":"Why Superbottoms - Journey, Challenges \u0026 Strengths:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Growing up I saw a lot of ads that did not matter for almost 29 years of my life, as they were related to baby products and had no relevance for me. Suddenly, the day I became a mother, everything changed. I started reading more, researching more on all products that I would need for my kid and finding out better alternatives that work, are not too costly and make our lives a little easy as new parents. Trust me any woman who has gone through the 3rd trimester nesting phase can hard relate to this!!!","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"A thought that transcends gender, nationality, class, financial status, social status, etc. is that 'Every parent wants the best for their children'. Affordability and geography impact the final 'what' you can offer but the want is always there. And one of the primary want for new parents is a good solution for the 'POOP' situation - what diapers, how many diapers, what wipes, how many wipes, what changing station, etc.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Also, the number of diapers that a child goes through if you are using only disposable ones, each child can have his own little diaper mountain and a BIG chunk of the family income (middle class) ends up in solving for poop related things!","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"stinky-diaper-5835900.webp","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":220.15809765625,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/f1ef145faf-stinky_diaper_5835900.webp","type":"image","version":1,"width":208},{"detail":0,"format":0,"mode":"normal","style":"","text":"                            ","type":"text","version":1},{"altText":"0bbf4261-bc9d-49fb-a3cb-0064adb5b428-DiaperService4.jpg","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":196.43508623466877,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/2852e4ac37-0bbf4261_bc9d_49fb_a3cb_0064adb5b428_DiaperService4.jpg","type":"image","version":1,"width":293.8095703125},{"detail":0,"format":0,"mode":"normal","style":"","text":"  ","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"After learning about all this, one cautious parent, Pallavi Utagi, wanted to find the best diaper for her kid and was thoroughly disappointed in her search. She was looking for an affordable, durable and comfortable cloth diaper that wasn't a traditional ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"","text":"langot","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":". This search brought her to the conclusion that like her many mothers are searching for the best diaper with no results that tick all the good boxes giving the best of both worlds, and that is how 'Superbottoms' was born!!","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"Superbottoms google search.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/d31dd0a1b8-Superbottoms_google_search.png","type":"image","version":1,"width":"inherit"},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"While ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"","text":"dadis ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"and ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"","text":"nanis","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" keep on saying that use a ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"","text":"langot ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"or cotton threaded cloth to save from rashes, in today's time it is practically difficult to execute. And although disposable diapers seem convenient for the working, neutral busy families, they come with their own set of problems like rashes, bulk to carry while travelling, environmental issues, not sustainable, habit forming that leads to longer time to potty train, etc. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Superbottoms came up with a solution that gives us the best of both worlds i.e. a cotton like soft material that ensures ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"rash-free bottoms","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":", can be ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"washed by hand or machine ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"saving time \u0026 being travel friendly (most of the times), does not lead to unnecessary waste generation, etc. Another differentiator for Superbottoms has been the mom community. As someone who faced challenges in returning to the workforce after having a kid, Pallavi decided to make her company a mom first company and customers became employees, new moms were preferred in the hiring process with the additional requirement that their kid must be a superbottoms user. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"Landing first fold - Laptop.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/1c93f970d1-Landing_first_fold___Laptop.png","type":"image","version":1,"width":"inherit"},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"While the journey does seem noteworthy, it came with it's own set of challenges. To name a few, they were entering a market which had pretty big well known brands with big money to invest in marketing and distribution. Another issue was the replicability of the product, although not easy but not impossible either and they faced it very soon after launching \u0026 gaining popularity. Big brands like Pampers also started launching cotton diapers competing in the exact same segment as Superbottoms, they had soon lost their first mover advantage. ","type":"text","version":1},{"detail":0,"format":9,"mode":"normal","style":"","text":"But their biggest strength was not the product or VCs that kept them afloat during all these times, it was actually the mothers community that they built.","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":" ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"Their product differentiation \u0026 continuous feedback \u0026 iterative launches helped them stay ahead of the curve while everybody else followed suit. They gave new mothers a safe space \u0026 forum to discuss their issues and needs, be it from feeding to discussions on maternity leave \u0026 work. They have an active Facebook, Instagram and WhatsApp community that helps mothers on a variety of topics and it is also an important part of their onboarding journey. A large chunk of their sales and product testing happens via this medium, they run a lot of programs for mothers to come and help in building the company.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"Third fold - Laptop.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/22c9846302-Third_fold___Laptop.png","type":"image","version":1,"width":"inherit"},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"Why did I choose Superbottoms for this assignment?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"I am a DAU for Superbottoms, rather my 1.5 year old daughter is. I have used a wide variety of their products for my child for more than a year and have advocated other moms to try their products as well, they make life a little easier when you have a toddler running all over the place.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Also, I strongly relate with the founder, her struggles to make a passion project into a full fledged career, trying to make a mark in the male dominated VC world all while taking care of a growing child and their needs. I believe this category \u0026 company have huge growth potential and other than the obvious benefits, the sustainability factor is important in today's context.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":8,"mode":"normal","style":"","text":"Challenges Superbottoms is facing today:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Segment first mover, now facing heavy competition - Copycat products have entered the market, eating away market share and reducing differentiation","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Low repeat orders as customers are buying some products from each brand to try and do not know what to with the extra orders","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Marketplaces like Firstcry \u0026 Amazon make up a good margin of their overall sales but categories and sizes are not mentioned/sold correctly on these platforms. For ex. you cannot choose a size for your kid when you purchase padded underwears despite a size-chart being present, so you don't know what you will receive when buying from FirstCry.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Lower awareness about their products that cater to special needs kids or women or bed-wetting older kids - lower sales in these categories","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":4}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"And these are solvable challenges on the product, sales \u0026 business end by implementing the right strategies.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"background-color: #413F3F;","text":"Product Value Proposition and Sales:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h3"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Superbottoms USP products are their UNO 2.0 diapers and padded underwears. These are made with a material that is certified across boards (USA, Australia, Europe, etc.) and have no chemicals that can cause irritation or rashes to the kid. The material absorbs water (pee) while giving a dry feeling to the child and the outer layer is also made of a material that ensures that clothes (of the kid \u0026 the person holding the kid) do not spoil. It lasts relatively longer than traditional ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"","text":"langots","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" but shorter than good quality disposable diapers making it a good use case for daily home wear usage. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"superbottoms-reusable-and-washable-cloth-diapers-for-babies-cloth-diaper-freesize-uno-new-version-product-images-orv0gv0rudv-p595793551-2-202211282015.webp","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":294.10177799567083,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/b4deda4d6a-superbottoms_reusable_and_washable_cloth_diapers_for_babies_cloth_diaper_freesize_uno_new_version_product_images_orv0gv0rudv_p595793551_2_202211282015.webp","type":"image","version":1,"width":235.8115234375},{"detail":0,"format":0,"mode":"normal","style":"","text":"   ","type":"text","version":1},{"altText":"40254321_1-superbottoms-basic-cloth-diaper-freesize-adjustable-washable-and-reusable-cloth-diaper-for-day-time-use-with-dry-feel-padsoakerinsert-cupcake.webp","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":258.8095703125,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/2f53caa7df-40254321_1_superbottoms_basic_cloth_diaper_freesize_adjustable_washable_and_reusable_cloth_diaper_for_day_time_use_with_dry_feel_padsoakerinsert_cupcake.webp","type":"image","version":1,"width":258.8095703125},{"detail":0,"format":0,"mode":"normal","style":"","text":"   ","type":"text","version":1},{"altText":"96b4f019-719c-42b0-8784-501cff0efd4a1693980183056BabyCareProducts1.jpg","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":286.3799151293414,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/26dc80d21e-96b4f019_719c_42b0_8784_501cff0efd4a1693980183056BabyCareProducts1.jpg","type":"image","version":1,"width":214.99603271484375}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Another advantage is that unlike disposable diapers or cotton ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"","text":"langots, ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"most of the diapers are adjustable for size and a single fit can be used for kids from 3 months to 3 years increasing shelf life. A differentiator about these diapers is that instead of single colours or whites, they have eye-catchy, cool and cute prints and these are updated regularly and a primary attraction for a lot of parents. They claim that a single diaper can be used upto 300 washes while keeping the quality intact. They also sell detergents specifically to be used for their diapers that increase the longevity of the diaper and keeps it like new. These diapers can be hand-washed and machine washed without any impact on quality, the product packaging comes with a detailed explanation on how to wash and maintain the product. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"Image7withtag_2523af06-df1c-40a8-8f8c-2652adbadd16.webp","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":295,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/36c7bf5e0b-Image7withtag_2523af06_df1c_40a8_8f8c_2652adbadd16.webp","type":"image","version":1,"width":295},{"detail":0,"format":0,"mode":"normal","style":"","text":"        ","type":"text","version":1},{"altText":"FSUNOwashweb_81335122-cd6e-4790-b17e-883411b07133.webp","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":293,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/66bd874f1c-FSUNOwashweb_81335122_cd6e_4790_b17e_883411b07133.webp","type":"image","version":1,"width":293}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Since it is not a regular diaper, they also have a detailed buying guide (on the website) and washing guide (as part of packaging) made available. For building trust on the brand, they have onboarded celebrity moms like Alia Bhatt and Neha Dhupia to promote the brand. To show that they care about their customers, they started 2 programs - ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"1. Book a free demo","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" - Online or at Home - get an idea about the products, how they are used and benefits from your 'SuperBuddy'; 2.","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":" \"Use \u0026 Return\" Trial policy","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" - Use the UNO product for 15 days and if you are not satisfied, you can return the product.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"As of 2023, 45% of the sales come from their website while the rest was divided between physical stores (own \u0026 retailers), ecommerce marketplaces (Amazon, Firstcry, Flipkart, etc.) and quick-commerce (Zepto, BlinkIt). Since the data for these is not readily available, fragmented and difficult for assessing activation, for the focus of this onboarding journey, we would look at their website as the primary channel for activation \u0026 onboarding journeys. A 2023 report gives the following stats on their progress so far:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":176.9176875,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/6e9f42d6a7-image.png","type":"image","version":1,"width":512},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"They are Series A funded company with the last round completed in Aug 2023 worth $5mil totaling their overall fund raise to $10.5mil","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/8a0269a344-image.png","type":"image","version":1,"width":"inherit"},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Further details on the revenue and investments:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":235.47529431152344,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/8f27f75ee5-image.png","type":"image","version":1,"width":483},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Superbottoms has good potential as they increase the product categories and user base (larger age group of kids covered \u0026 women-centric products).","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"background-color: #413F3F;","text":"Competition \u0026 Current Standing:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h3"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Currently Superbottoms (as claimed by them) has served more than 20lakh customers with a google review of 4.6 (990 reviews).","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":335.82021658318206,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/8f594513e1-image.png","type":"image","version":1,"width":464.98809814453125},{"detail":0,"format":0,"mode":"normal","style":"","text":"    ","type":"text","version":1},{"altText":"Screenshot_20240615-111012.jpg","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":336.2856726540851,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/8e84440fa4-Screenshot_20240615_111012.jpg","type":"image","version":1,"width":150.99801635742188}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":160.63219961775545,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/ada135af4d-image.png","type":"image","version":1,"width":388.9980163574219}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Demographic distribution for the platform: The most active age group is new or relatively new parents but the surprising part is the gender distribution. Most of the data that Superbottoms collects and as per reviews as well, majority of the purchase is done by women but here male % is higher than that of female. This could be attributed to various things like wives using their husband's phone to do the final purchase, fathers also checking out the product when they want to contribute to the buying decision as influencer or blocker, etc.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"Demographic distribution.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":306.9960530598958,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/1c0fb8131f-Demographic_distribution.png","type":"image","version":1,"width":550}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Device distribution for the platform:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"Web vs Mobile web traffic.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":324.90028043619793,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/5c0f3dc911-Web_vs_Mobile_web_traffic.png","type":"image","version":1,"width":559},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"They have ranked #1 as per Tracxn amongst identified competitors in this segment. Being a first mover in the category, Superbottoms may rank better than competitors but there are indirect competitors in the disposable category that cater to a much larger customer base (","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"Pampers, Huggies, BabyHug, MamyPoko, Himalaya Babycare, Mother Sparsh,","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" etc.). As per Economic times, the Indian diaper industry is currently pegged at about ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"Rs 10,000 crore","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" where Procter \u0026 Gamble controls nearly 38.3% and Unicharm at about 38.9% as of December 2023. As a category within consumer goods, diapers have one of the highest sales coming from online channels with an estimated CAGR of 6-7%.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"In the cotton or cloth diaper segment, there are following competitors:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Bumberry - Cloth diapers catering to 0 to 3 years and adult diapers, less category diversification","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Bumpadum - No website sales, only available on marketplaces","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Tickles - Only caters to kids from 0 to 3 years for diapers and bibs","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"A toddler thing - Have expanded to kids apparel with existing cotton diapers \u0026 nappies","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":4},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Snugkins - Primary focus is diapers \u0026 potty training apparel with expansion in all clothes for kids","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":5},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Newboo - Sells 1 type of diaper only","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":6},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"KiddieHug - Have expanded to kids apparel with existing cotton diapers \u0026 nappies","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":7},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Mother Sparsh - Started with toiletries for kids and have expanded to all kids products along with diapers","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":8},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Bumtum - No website, only available on marketplaces","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":9},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"BabyHug - Selling disposable, cloth diapers and other baby products too, complete range of ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":10}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"There are also other companies that are selling disposable bamboo diapers that ensure the sustainability and dry feel with no need for washing and has been gaining traction. Key player in this segment is ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"Allter ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"but their challenge is the price point is very high compared to any of the other disposable or reusable diapers in India.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"background-color: #413F3F;","text":"Product categories:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"With a lot of trial \u0026 error and international tests \u0026 certifications, Superbottoms launched their padded buttoned diapers first. This was followed by a variety of diaper products over the years like UNO, UNO 2.0, padded underwears, potty training pants, etc. and now they have launched more categories and products for kids (0 to 8 years) and women (12 to 50 years). Speaking with mothers have given them a social edge over competitors with their products that cater to kids with special needs, older kids who bed-wet, nursing pads, bladder lead underwears of postpartum women, etc.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Broadly categorizing with respect to products and users:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"A. Children (0 to 8 years)","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" - Cloth diapers, ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"","text":"langot","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":", wipes, pants, potty training underwears, regular underwears,  kids apparel, bibs, swaddle, seed pillows, diaper changing mats, underwear for kids with special needs, underpants for older bed-wetting kids, etc.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":212.28370865213972,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/b2d460791c-image.png","type":"image","version":1,"width":232.80555725097656},{"detail":0,"format":0,"mode":"normal","style":"","text":"   ","type":"text","version":1},{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":195.39826844570317,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/1d754b359f-image.png","type":"image","version":1,"width":235.80557250976562},{"detail":0,"format":0,"mode":"normal","style":"","text":"   ","type":"text","version":1},{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":191.2519113638404,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/07ad9bdb19-image.png","type":"image","version":1,"width":224.81353759765625}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"B. Parents (Gender agnostic)","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":" ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"- Diaper bag, detergent, travel bags, planters, etc.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":166.47480249023437,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/9a42bd35df-image.png","type":"image","version":1,"width":699},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"C. Women (Menstruating and Moms)","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":" ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"- Period underwear, cloth sanitary napkins, nursing pads, bladder leak underwear, etc.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":139.65572989615433,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/d6a46110e4-image.png","type":"image","version":1,"width":238.81350708007812},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"D. Gifting","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" - Gifting options for baby shower, naming ceremonies, birthdays, etc. for moms with newborns or toddlers that includes actual product combos as well as gift cards","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":297.57973201633223,"maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/a597e297d9-image.png","type":"image","version":1,"width":326.984130859375},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"background-color: #413F3F;","text":"User Interviews:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"For this project, I interviewed retained customers, with their latest purchase done in the last 2 months. This has given me latest insights \u0026 also the user/customer has been more aware of the product. User interviews were conversational where I tried to understand their demographic, pain points and current solutions. A clear question asked before starting the interview was if they liked Superbottoms products and if their last purchase was a recent one and only the ones that said yes are considered for this assignment. Following are some snippets from the conversations:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"User 1 (26/F) ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"- A working mom (currently on sabbatical) of a 15 month old, first used Superbottoms 8 months ago (UNO 2.0) and have not tried other product categories but continued buying more of the same product, first heard about the product through Instagram ads.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Words/Adjectives used -- Soft, dry feels, convenient to wash and maintain, lasts for long, good for rainy season, trial pack availed, aware about demo","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"User 2 (36/F) ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"- A working mom of a 7 month old, first used Superbottoms when her son was 2 month old due to diaper rashes, got to know about it from online mom community and exploring more products as they are launched.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Words/Adjectives used -- Absorbent, Snug fit, Less changes than ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"","text":"langot","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":", In-between disposable and cotton cloth, trial pack not availed, not aware about demo","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"User 3 (30/F)","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" - A homemaker raising a 15 month old in a joint family, have tried various brands, got to know about Superbottoms from family friends, primarily use UNO 2.0 and padded underwears.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Words/Adjectives used -- Good prints, dry feels, expensive initially but value for money in the long run, ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"convenient to use, rash free bottoms, trial pack availed, demo availed","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"User 4 (31/F)","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" - Working mom of a 2.3 year old toddler, have been using Superbottoms for almost 2 years and have used a bunch of their products for her child. She is also active in the mom communities and loves to contribute to both questions \u0026 answers in the community. She searched online and found Superbottoms for her diapering needs. She is aware of the female hygiene products sold but has never brought any.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Words/Adjectives used -- Convenient, Dry feels, Good absorption, additional pads for night use, easy to wash, less space needed to carry when I visit my parents, fun prints, trial pack availed, not aware about demo","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"User 5 (32/M)","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" - Working father of a 20 month old, have been using Superbottoms for 1.5 years and have used a couple of products for the kid, research and purchase done by wife, is not aware of female hygiene products they sell","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Words/Adjectives used -- Easy to put on the baby, easy to wash the poo, good absorption, better sleep for the baby \u0026 parents, plays on the bed without worry of leakages, trial pack availed, not aware about demo","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"A very strong point that came out during the user interviews, online reviews as well as sales data readily available about Superbottoms is that although quite a few men contribute in cleaning and changing the diapers, the buying decision still lies with the mother in 90%+ households. Even the washing decisions like handwash vs machine-wash, self vs maid/nanny, detergent brand, etc. are taken by the women or mother of the child. Hence, they would make up the primary ICP and also it is clear why Superbottoms is focusing on more women centric products as well, owing to the already built trusted network of women.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"The only user I could not find to interview were active users of the women specific products, even when mothers were aware of these products. One of the reasons they haven't tried these products is because their daily life is so busy that they don't have time to try new period related products. Another reason was that they already purchased nursing pads (disposable, non-disposable) from other brands before delivery and don't find a need for it anymore. Albeit these products are recent launches \u0026 while Superbottoms is actively advertising them on social media, actual flow of customers willing to use these would be gradual.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"As for the kids products, one product that all customers have tried is the UNO 2.0 i.e. their USP product and still continue to use it daily. They also recommend this product to new mothers in their friends and family circles.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"background-color: #413F3F;","text":"ICPs:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Looking at the retained customers, products the company sells and what products they also want to increase sales for, we have 3 different ICPs with different pain points and solutions.  ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"tablerow","version":1}],"format":"","indent":0,"type":"table","version":1}],"format":"","indent":0,"type":"gx-table-container","version":1},{"children":[{"children":[{"children":[{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"ICP Name","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":248},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"ICP 1 - Parent who is interested in all kids products","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":401},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"ICP 2 - Parent looking only for diaper alternatives","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":336},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"ICP 3 - Women interested in products other than diapers","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":340}],"format":"","indent":0,"type":"tablerow","version":1},{"children":[{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Age","type":"text","version":1}],"direc
