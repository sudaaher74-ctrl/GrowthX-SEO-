nths to 8 years catering to my growing baby's needs","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"To be leak-proof and stain-free during periods or when facing bladder leakages (associated with pregnancy \u0026 postpartum)","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"To be leak-proof and stain-free during my nursing phase","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1}],"format":"","indent":0,"type":"tablerow","version":1},{"children":[{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Secondary","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Personal goals","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"To have a happy, well slept, rash-free kid leading to happy, well slept parents","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"To keep my hands soft by not hand washing big loads of cotton ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"","text":"langots","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":", beddings, clothes, etc.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"To have a happy, well slept, rash-free kid and in turn have happy well slept parents","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"To save time for other tasks with a reduced laundry load","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"To have less chemical exposure to sensitive body parts and feel comfortable in what you wear","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1}],"format":"","indent":0,"type":"tablerow","version":1},{"children":[{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Secondary","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Social goals","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"To have attractive fun prints that look good while travelling or visiting friends and family","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"-","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"-","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1}],"format":"","indent":0,"type":"tablerow","version":1},{"children":[{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Secondary","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Financial goals","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"-","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"To get value for money in the long run by spending less on disposable diapers","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"To reduce the monthly expenses on sanitary napkins \u0026 panty liners","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1}],"format":"","indent":0,"type":"tablerow","version":1}],"format":"","indent":0,"type":"table","version":1}],"format":"","indent":0,"type":"gx-table-container","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"background-color: #413F3F;","text":"Product Teardown:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"While Superbottoms products are sold from their platform as well as other retailers (online \u0026 offline), for the onboarding project we are only focusing on their platform. Owing to this we first check the lead distribution to finalize the right platform to be assessed. After a quick check for recent users, we have the following data:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"Web vs Mobile web traffic.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/8ceddeecb3-Web_vs_Mobile_web_traffic.png","type":"image","version":1,"width":"inherit"},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Since ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"96%+ users come to the platform using their mobile devices","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":", that would be the ideal platform for the teardown. I am using an android device to do the onboarding teardown.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Another point to note is that this is a d2c platform that gives the customer a chance to see everything on the platform before collecting more information from them. ","type":"text","version":1},{"detail":0,"format":8,"mode":"normal","style":"","text":"So there are activation milestones placed across the website which the user can reach from any screen or flow","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":". Because there is no fixed flow or set of steps that the user takes to reach the milestones, we will analyze all screens that can lead to the milestones and do a teardown without focusing a lot on sequence.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #F2F2F2;","text":"Detailed teardown of the mobile web journey:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"url":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/53049de15e-GrowthX_Onboarding_Teardown.pdf","fileName":"GrowthX Onboarding Teardown.pdf","fileSize":7039053,"pages":36,"version":1,"type":"pdf"}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"Summary of the onboarding teardown","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":": ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"The onboarding experience feels like that of a homegrown d2c brand where product categories are highlighted upfront along with a primary and may be a secondary theme going on the first few folds. The two clear themes that came out of the first few folds and copy were \"Discounts/Offers/Lower prices\" and \"Absorption, dry feel\". The product images and graphics are well placed throughout the journey to keep the user engaged and build a trust on what to expect in the final delivered product. Images also depict how the product would look like in shape and how it would fit the customer after wearing.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Using the right celebrities \u0026 influencers and showing their journey and recommendations upfront helps build trust for a new parent. The major takeaway for me are the \"trial pack\" - which no one is doing or heavily promoting in this category, shows that Superbottoms is confident that you will like the product and \"book a demo\" - a very unusual thing for a diaper brand but shows that they know that this is an involved purchase (not an impulse) and the customer may need some convincing to go ahead and buy. They have thoroughly used priming and progressive disclosures throughout the website, building a story and keeping the customer engaged to ensure the sale happens.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Better copy at certain places (as highlighted in the pdf) could do wonders in communicating the right things to the customer. Placement of blogs and SEO content can be improved to add further value to the customer's journey. Also, this is a fairly new category, I spoke to a few non-parents in their late 20s and early 30s and they were unaware and in awe of such a product's existence. This begs the question - how important is it to explain the user 'what the product does' and 'how to use the product'. These 2 questions are not clearly answered in the initial slides and the user needs to click atleast 2-3 times on the website to reach a point where this is well put. Although the physical product comes with a detailed pamphlet on how to use the product, this information should come out clearly and obviously early on in the user journey.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Also, certain screens and CTAs are overloaded with information that can break the purchase journey and lead to drop-offs. These need to be worked upon as mentioned in the recommendations. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"background-color: #413F3F;","text":"Activation Metrics:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Different users may experience different Aha! moments depending on the route they choose to buy the product:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Aha moments and user journey for user going via the trial product route:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"altText":"Activation with Trial pack.jpg","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/5144c078cc-Activation_with_Trial_pack.jpg","type":"image","version":1,"width":"inherit"},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Aha moments and user journey for user going via the free demo route:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1},{"altText":"Activation with demo.jpg","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/bd9b8926bc-Activation_with_demo.jpg","type":"image","version":1,"width":"inherit"}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Aha moments and user journey for user choosing to by the product they want (w/o trial or demo) i.e. majority users journey would be this:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1},{"altText":"Slide1.JPG","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://du2l2d5icvsbf.cloudfront.net/USER/gajal_jain_0a75a9bed9/EDITOR/MEDIA/4e43330857-Slide1.JPG","type":"image","version":1,"width":"inherit"}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"The primary metric or goal that the company wants to achieve is increased sales from both new users as well as existing users. Activation metrics can be related to direct sales done in a period of time or could be a strong enabler for sales in a given time period. A secondary metric to track would be cross-selling outside category for the same user (child) or category for another type of user (woman).","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"Following are the hypothesis for activation metrics that could directly or indirectly contribute in increasing sales.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"Hypothesis 1:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Customers buying the trial pack in 30 days from first landing on the platform","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Reasoning: Choosing a diaper is an involved buying process specially a cloth diaper because you have to also plan for the process after purchase. How frequently and who would change it, how often would you wash them, would you handwash or machine wash, who would do the full handwash or basic cleaning/soaking before putting it in the machine and when, etc. need to be answered for the customer. Another question that arises is how many would you need to go buy the day \u0026 night i.e. 24 hours with enough supply for the next day because it takes a while for these to dry. Buying a trial pack can help check if this is the right choice for the customer \u0026 their family and it should be done in the 1st 30 days else it is very unlikely that they will return to buy.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"Hypothesis 2:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Customers doing the first transaction in 30 days of first landing on the platform","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Reasoning: A transaction done in the first 30 days ensures activation with one of the milestones placed across the journey. Due to the product categorization, testing and feedback driven modifications, once atleast a single transaction is done, chances of repeat buying increase drastically. Also, beyond 30 days, it is challenging that the customer would come back to buy the product.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"Hypothesis 3:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Customers booking a demo (virtual or at home) in 2 weeks from first landing on the platform","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Reasoning: Customers booking a demo are put in touch with another mother who has used Superbottoms (may be an employee or strong community partner) who would detail out benefits more clearly. They would also be in a good position to nudge the buying process, encourage trials and show the look \u0026 feel of the product. New mothers tend to look for guidance \u0026 support with experienced mothers for various things related to the baby \u0026 postpartum and the trust on another mother is generally high leading to conversions and purchase.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"Hypothesis 4:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #3096FF;","text":" ​","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Customers signing up (by adding products to the cart or creating a wishlist) within 15 days","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Reasoning: By selecting the products they are interested in and signing up, the user has given a clear indication of intent along with product for which buy intent exists. Their buy journey may have paused due to various reasons like wanting to discuss it with someone before buying, physical break (had to close the site), low battery, etc. Nudging these customers with good communication touchpoints along with additional offers \u0026 discounts can lead to a higher conversion rate.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"Hypothesis 5:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" ","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"color: #3096FF;","text":"Customers buying the trial have not returned the product in 30 days","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Reasoning: If a customer has not returned the trial products, chances are high that they liked and are using the product regularly (maybe even daily). The recall value once you start using the product is high as you are frequently holding and seeing it. This recall value and comfort with the product along with added nudges and communication touchpoints may lead the customer to come back to the platform and buy more products from other categories or repeat buy the same products.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":9,"mode":"normal","style":"","text":"Metrics to track effectiveness","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":":","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1},{"children":[{"detail":0,"format":8,"mode":"normal","style":"","text":"Quantitative:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"For this category, D1, D7 and D30 metrics i.e. number of users who came on D0 and are coming back on D1/D7/D30 would not be valid because once the user has made a purchase, the next purchase can take 60 to 90 days even for the primary ICP. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"In this case, post 1st purchase, ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"","text":"M2 a
