.\n\nThis project will help you build and operationalize a high-impact growth team. You will do 5 clear things:\n• Craft your hiring equation and identify key levers to optimize for growth hiring\n• Build a compelling careers page, clear job descriptions, and a solid founder’s first brand that attracts the right talent\n• Create a structured and unbiased evaluation process to ensure fair and consistent hiring decisions\n• Define clear OKRs \u0026 a 30-60-90 day plan to help new hires align with team goals, stay motivated, and deliver orbit-changing revenue impact\n• Scale your growth team with clear roles, processes, and workflows"}]}},{"visibility":"PUBLIC","type":"SEO_METADATA","version":1,"content":{"ogImage":"https://public-cdn.growthx.club/learning-experience-products/production/building-growth-teams/building-growth-teams/9e3b2992fe-Fold 12.png","ogTitle":"Building Growth Teams | Course | GrowthX","ogDescription":"Learn to attract bar raiser talent, how to evaluate top talent that delivers not just in interviews \u0026 a blueprint to ensure the hires drive orbit changing revenue impact."}},{"visibility":"PUBLIC","type":"CURRICULUM","version":1,"content":{"modules":[{"name":"Building Growth Teams","summary_icon":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/intro.svg","sub_modules":[{"name":"Problems with growth hiring","description":"We’ll understand the entire hiring process by re-imagining it as a funnel, and then identify the gaps/problems with the hiring funnel. "},{"name":"The hiring equation","description":"We’ll understand hiring through a hiring equation, which will give you clear levers to optimise for in order to solve for growth hiring."}]},{"name":"Attracting bar raiser talent","summary_icon":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/equation.svg","sub_modules":[{"name":"Building the career’s page","description":"Understand the essential elements of a compelling job page that attracts the right candidates and sets expectations clearly."},{"name":"Building the job description","description":"Learn how to craft job descriptions that are concise, targeted, and clear. Not boring, jargony job descriptions."},{"name":"Building a founder brand","description":"Learn how to create a founder first brand that builds trust, credibility and attracts mission aligned talent."}]},{"name":"Unbiased evaluation criteria","summary_icon":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/speedy_ball.svg","sub_modules":[{"name":"Introduction to hiring guide","description":"Discover how hiring guides eliminate ambiguity by creating clear, objective evaluation process that align with team goals and reduce biases."},{"name":"Process and panelists","description":"Define a clear hiring process with structured interview rounds and select the best panelists for each round to ensure fair and thorough evaluations."},{"name":"Feedback and rating","description":"Learn how to create standardised feedback mechanisms and rating systems that support objective decision-making."},{"name":"Interview etiquette","description":"Learn how to conduct interviews professionally and fairly, ensuring candidates have a positive experience."}]},{"name":"Setup talent for success","summary_icon":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/spanner.svg","sub_modules":[{"name":"Activating a new employee","description":"Learn the equation to activate a new employee. Develop a structured onboarding plan to integrate new hires and align them with growth objectives"},{"name":"Hitting a milestone","description":"Set clear milestones to track progress and celebrate early wins, inculcating confidence and motivation among new employees."},{"name":"Aha moments","description":"Build learning maps to reduce time to value and make sure employees deliver orbit changing revenue impact."}]}]}},{"visibility":"PUBLIC","type":"ENROLL_CARD_LIST","version":1,"content":{ BGT1.png","props":{"background":"#0c0c0c","style":{"objectFit":"contain"}}}},{"title":"Async learning experience","description":"CRAFTs are self paced learning programs, meant to fit the schedules of high performing working professionals.","content":{"type":"img","url":"https://public-cdn.growthx.club/product_images/crafts/BGT2.png","props":{"background":"#0c0c0c","style":{"objectFit":"contain"}}}}]}},{"heading":"question","visibility":"PUBLIC","type":"FAQ","version":1,"content":{"faqs":[{"summary":"What will I learn in this course?","detail":"By the end of this CRAFT, you will have a structured framework to attract, evaluate, and activate the top talent effectively.\n\nYou’ll leave with 5 core learning outcomes:\n• Build your hiring equation\n• Learn how to attract bar raiser talent\n• Learn to evaluate talent that performs not just in interviews\n• Solve for new employee motivation by building learning maps\n• Scale and operationalize your growth team"},{"summary":"Who is the Building Growth Teams CRAFT for?","detail":"The CRAFT of Building Growth Teams is for anyone trying to build, scale, and operationalize a growth team. It’s a non-negotiable for growth teams, the core-team, and founders."},{"summary":"Who is this CRAFT not for?","detail":"This CRAFT is not meant for folks who are not looking to build, hire, or scale a growth team. Additionally, if you’re currently in pre-PMF or not in a growth stage, you should not invest in this CRAFT."},{"summary":"Who will I learn from?","detail":"The program director for Building Growth Teams is Udayan Walvekar, Co-founder of GrowthX. Over the last 10 years, he has led growth teams across industries and stages of companies from seed stage to Series F. From building the first product growth team at Razorpay to helping hundreds of founders and leaders inside GrowthX, he has distilled all that he has learned about building growth teams into this CRAFT."},{"summary":"What is the project? And is it mandatory?","detail":"Yes, do ":[{"name":"Building the career’s page","description":"Understand the essential elements of a compelling job page that attracts the right candidates and sets expectations clearly."},{"name":"Building the job description","description":"Learn how to craft job descriptions that are concise, targeted, and clear. Not boring, jargony job descriptions."},{"name":"Building a founder brand","description":"Learn how to create a founder first brand that builds trust, credibility and attracts mission aligned talent."}]},{"name":"Unbiased evaluation criteria","summary_icon":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/speedy_ball.svg","sub_modules":[{"name":"Introduction to hiring guide","description":"Discover how hiring guides eliminate ambiguity by creating clear, objective evaluation process that align with team goals and reduce biases."},{"name":"Process and panelists","description":"Define a clear hiring process with structured interview rounds and select the best panelists for each round to ensure fair and thorough evaluations."},{"name":"Feedback and rating","description":"Learn how to create standardised feedback mechanisms and rating systems that support objective decision-making."},{"name":"Interview etiquette","description":"Learn how to conduct interviews professionally and fairly, ensuring candidates have a positive experience."}]},{"name":"Setup talent for success","summary_icon":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/spanner.svg","sub_modules":[{"name":"Activating a new employee","description":"Learn the equation to activate a new employee. Develop a structured onboarding plan to integrate new hires and align them with growth objectives"},{"name":"Hitting a milestone","description":"Set clear milestones to track progress and celebrate early wins, inculcating confidence and motivation among new employees."},{"name":"Aha moments","description":"Build learning maps to reduce time to value and make su
