 take all of the terms and conditions stated on this page.\n\nThe following terminology applies to these Terms and Conditions, Privacy Statement and Disclaimer Notice and all Agreements: \"Client,\" \"You,\" and \"Your\" refers to you, the person log on this website and compliant to the Company’s terms and conditions. \"The Company,\" \"Ourselves,\" \"We,\" \"Our,\" and \"Us\" refers to our Company. \"Party,\" \"Parties,\" or \"Us\" refers to both the Client and ourselves.\n\nAll terms refer to the offer, acceptance, and consideration of payment necessary to undertake the process of our assistance to the Client in the most appropriate manner for the express purpose of meeting the Client’s needs in respect of the provision of the Company’s stated services, in accordance with and subject to, prevailing law of India. Any use of the above terminology or other words in the singular, plural, capitalization, and/or he/she are taken as interchangeable and, therefore, referring to the same.\n\n## Cookies\n\nWe employ the use of cookies. By accessing GrowthX, you agreed to use cookies in agreement with the GrowthX Education Labs Pvt Ltd Privacy Policy.\n\nMost interactive websites use cookies to let us retrieve the user’s details for each visit. Our website uses cookies to enable certain areas' functionality and make it easier for people to visit our website. Some of our affiliate/advertising partners may also use cookies.\n\n## Refund Policy\n\nMembership fees are refundable until 7 days before the closest 8-week immersion start date. For example: If you paid on June 28 and the closest immersion start date is August 7, you will be eligible for a refund until August 1\n\nMembership fees are not refundable if the immersion start date has passed or if the member has consumed any learning modules/content of GrowthX or spent more than 9 weeks as a member in the community, whichever comes first\n\n## License\n\nUnless otherwise stated, GrowthX Education Labs Pvt Ltd and/or its licensors own the intellectual property rights for all material on GrowthX. All intellectual property rights are reserved. You may access this from GrowthX for your own personal use subjected to restrictions set in these terms and conditions.\n\nYou must not:\n\n- Republish material from GrowthX\n- Sell, rent, or sub-license material from GrowthX\n- Reproduce, duplicate or copy material from GrowthX\n- Redistribute content from GrowthX\n\nGrowthX members agree to not compete with any of the educational products (in the professional training \u0026 continuous learning space) and any of the hiring platform/services businesses If we find any proof of such involvement, GrowthX reserves the right to followup with legal action. The jurisdiction for which will be Pune, Maharashtra, India.\n\nParts of this website offer users an opportunity to post and exchange opinions and information in certain areas of the website. GrowthX Education Labs Pvt Ltd does not filter, edit, publish or review Comments before their presence on the website. Comments do not reflect the views and opinions of GrowthX Education Labs Pvt Ltd, its agents, and/or affiliates. Comments reflect the views and opinions of the person who posts their views and opinions. To the extent permitted by applicable laws, GrowthX Education Labs Pvt Ltd shall not be liable for the Comments or any liability, damages, or expenses caused and/or suffered due to any use of and/or posting of and/or appearance of the Comments on this website.\n\nGrowthX Education Labs Pvt Ltd reserves the right to monitor all Comments and remove any Comments that can be considered inappropriate, offensive, or causes a breach of these Terms and Conditions.\n\nYou warrant and represent that:\n\n- You are entitled to post the Comments on our website and have all necessary licenses and consents to do so;\n- The Comments do not invade any intellectual property right, including without limitation copyright, patent, or trademark of any third party;\n- T owthX Education Labs Pvt Ltd, and (d) the link is in the context of general resource information.\n\nThese organizations may link to our home page so long as the link: (a) is not in any way deceptive; (b) does not falsely imply sponsorship, endorsement, or approval of the linking party and its products or services; and (c) fits within the context of the linking party’s site.\n\nIf you are one of the organizations listed in paragraph 2 above and are interested in linking to our website, you must inform us by sending an e-mail to GrowthX Education Labs Pvt Ltd. Please include your name, your organization name, contact information as well as the URL of your site, a list of any URLs from which you intend to link to our Website, and a list of the URLs on our site to which you would like to link. Wait 2-3 weeks for a response.\n\nApproved organizations may hyperlink to our Website as follows:\n\n- By use of our corporate name; or\n- By use of the uniform resource locator being linked to; or\n- Using any other description of our Website being linked to that makes sense within the context and format of content on the linking party’s site.\n\nNo use of GrowthX Education Labs Pvt Ltd's logo or other artwork will be allowed for linking absent a trademark license agreement.\n\n## iFrames\n\nWithout prior approval and written permission, you may not create frames around our Webpages that alter in any way the visual presentation or appearance of our Website.\n\n## Content Liability\n\nWe shall not be held responsible for any content that appears on your Website. You agree to protect and defend us against all claims that are rising on your Website. No link(s) should appear on any Website that may be interpreted as libelous, obscene, or criminal, or which infringes, otherwise violates, or advocates the infringement or other violation of, any third party rights.\n\n## Your Privacy\n\nPlease read Privacy Policy.\n\n## Reservation of Rights\n\nWe reserve the right to request that you
