ic-cdn.growthx.club/learning-experience-products/production/crafts/new-blg-landing-page/blg-short-trailer.mp4"}},{"visibility":"PUBLIC","type":"PROGRAM_DIRECTOR","version":1,"content":{"name":"Swati Mohan","tagline":"Marketing leader","description":"Over her 20+ year career as a brand and marketing leader, she has led \u0026 scaled large  business verticals in leadership roles across Netflix, GroupM, Nat Geo \u0026 more across India \u0026 APAC.\n\nSwati was at the helm of Netflix India as the Chief Marketing Officer \u0026 led a large part of Netflix's India bet. In the next chapter of her career now, she actively advises consumer tech companies focused on brand as a core MOAT - some of my recent work includes CRED, SUGAR Cosmetics amongst others.She is also an active angel investor, typically investing in super early stage post PMF companies based out of India with a particular interest in purpose driven consumer tech companies led by ambitious founders.\n\nSwati spends her time speaking to early stage women founders \u0026 has coached 100+ founders in the last 18 months in association with IIM-Bangalore \u0026 Goldman Sachs.","photo":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/BLG/swati-mohan-2.webp","logos":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/BLG/pd-companies-1.webp","avatar":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/BLG/swati-avatar.svg"}},{"visibility":"PUBLIC","type":"OUTCOME_SLIDER","version":1,"content":{"outcomes":[{"title":"Design customer acquisition strategy","description":"Learn specifics of macro distribution strategy. Plus, learn nuances in brand, product positioning, channel mix \u0026 deep dive into 4 key channels - content loops, referral/ partner programs, paid ads \u0026 product integrations."},{"title":"Build your brand footprint.","description":"Your brand footprint is how your brand looks, speaks, and behaves across every touchpoint. The way your brand looks—whether premium, offbeat, or mass-market—becomes a reflection of the core values you stand for."},{"title":"Retain the most profitable customers with confidence.","description":"Define true retention \u0026 engagement metrics at the company level. Design repeat purchase journeys for ideal customers. Build depth of engagement that leads to reduced churn \u0026 building cross-sell opportunities."},{"title":"Solve your free users to paid customers \u0026 drive cross-sell.","description":"Structurally get readiness sorted before monetising your product. Design everything from pricing design, pricing Go-To-Market, free to paid/ cross sell journeys. Learn how to find price elasticity to maximise overall revenue."}]}},{"visibility":"PUBLIC","type":"PROJECT_SLIDER","version":1,"content":{"projects":[{"backgroundImage":"linear-gradient(180deg, rgba(255, 0, 4, 0.20), rgba(255, 255, 255, 0.20))","link":"https://community.growthx.club/public/proof-of-work/65b3b3c6f2ce4a2baa66566d","title":"Bring restaurant-style Asian food into the comfort of your home","description":"MasterChow is a flavor-packed passion project to bring restaurant-style Asian food to homes, with a focus on making home cooking easy, convenient and delicious!","company":{"name":"MasterChow","logoText":"🍜"},"includes":["Articulating the core value prop","Defining the job to be done","Brand wedge for MasterChow","Look, Feel \u0026 Speak for MasterChow","How it looks on and off the product","Example mockups"],"author":{"name":"Krishna Binzani","photo":"https://public-cdn.growthx.club/learning-experience-products/production/crafts/new-blg-landing-page/project-1-author.png","role":"Founder's Office","company":"https://public-cdn.growthx.club/learning-experience-products/production/crafts/new-blg-landing-page/author-1-company.svg","companyLogoHeight":"calc(29 * var(--baseline-font, 1px))"}},{"backgroundImage":"linear-gradient(180deg, rgba(0, 74, 255, 0.20) 0%, rgba(255, 255, 255, 0.20) 100%)","link" ce-products/production/crafts/new-blg-landing-page/author-3-company.svg","companyLogoHeight":"calc(29 * var(--baseline-font, 1px))"}}]}},{"visibility":"PUBLIC","type":"LEARNING_SECTION","version":1,"content":{"sections":[{"title":"Real world projects","description":"Consume and learn from 500+ projects built by GrowthX members","content":{"type":"img","url":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/BLG/projects-tab-1.webp","props":{"background":"#0c0c0c","style":{"objectFit":"contain"}}}},{"title":"Async learning experience","description":"CRAFTs are self paced learning programs, meant to fit the schedules of high performing working professionals.","content":{"type":"img","url":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/BLG/learning-tab.webp","props":{"background":"#0c0c0c","style":{"objectFit":"contain"}}}}]}},{"heading":"question","visibility":"PUBLIC","type":"FAQ","version":1,"content":{"faqs":[{"summary":"What will I learn in this course?","detail":"In this CRAFT, you'll learn how to build a brand from ground up, and set the basics of the brand right. By the end of this CRAFT, you will have a source of truth document for everything brand. \n    \nYou'll leave with 5 core learning outcomes:\n    • Craft your core value prop by understanding the users, product and market\n    • Define the JTBD of your brand\n    • Define your brand wedge - source of truth for everything brand\n    • Build your brand footprint - figure out how your brand looks, speaks \u0026 behaves\n    • Learn actionable strategies to apply brand footprint on \u0026 off your product"},{"summary":"Who is the Brand Led Growth CRAFT for?","detail":"The CRAFT of Brand Led Growth is for anyone trying to gain a deep understanding of how brands are built and the building blocks of brand. It's a non-negotiable for brand marketers, the core-team and founders."},{"summary":"Who is this CRAFT not for?","detail":"The CRAFT of Brand Led Growth is not meant for folks who do not have any levers on brand. Additionally, this CRAFT won’t help companies that are in late growth or mature scaling phase."},{"summary":"Who will I learn from?","detail":"The program direction for Brand Led Growth is Swati Mohan, Ex - CMO of Netflix, India.\nOver the past 2 decades, she has led large business verticals in leadership roles across Netflix, GroupM, Nat Geo \u0026 more across India \u0026 APAC. She currently consults brands like Sugar cosmetics, CRED, LeapClub, Whisper."},{"summary":"What is the project? And is it mandatory?","detail":"Yes, doing the project is mandatory. True learning doesn’t happen till you apply it. The only way CRAFTs work is when you apply it, i.e do the project.\n    \nThis project will help you craft the building blocks of your brand. You will do 4 clear things:\n    • Understand your ICP, product and market\n    • Define the JTBD and core value prop\n    • Craft your brand wedge - the source of truth for everything brand\n    • Deconstruct your brand across all touch points"}]}},{"visibility":"PUBLIC","type":"SEO_METADATA","version":1,"content":{"ogImage":"https://public-cdn.growthx.club/learning-experience-products/local/brand-led-growth/brand-led-growth/9ac99bee86-CS%20Horizontal%20Thumbnail.png","ogTitle":"Brand Led Growth","ogDescription":"Learn to build high-signal brands that drive exponential revenue impact."}},{"visibility":"PUBLIC","type":"CURRICULUM","version":1,"content":{"modules":[{"summary_icon":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/intro.svg","name":"Introduction to Brand Led Growth","sub_modules":[{"name":"Introduction to Brand Led Growth","description":"We will reimagine how to think about brand as a core business \u0026 growth strategy, as opposed to merely as a functional vertical that does big ads \u0026 social media."}]},{"summary_icon":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/intro.svg","name":"Identify core value prop","sub_modules":[{"name":"Deeply understand the ICP, product \u0026 market","description":"Gain context on ICP, product \u0026 market landscape identify opportunities to position your brand uniquely for growth"},{"name":"Craft the pain points \u0026 brand non-negotiables","description":"Identify category challenges, customer pain points \u0026 establish your brand’s non-negotiables for differentiation and consistency"},{"name":"Identify \u0026 articulate the brand JTBD","description":"Define the specific \"Jobs to Be Done\" your brand fulfils, aligning with customer needs and market demands"},{"name":"Articulate the core value prop","description":"Craft a clear, compelling value proposition that communicates your brand’s unique promise and competitive advantage"}]},{"summary_icon":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/intro.svg","name":"Build your brand identity","caseStudies":"https://public-cdn.growthx.club/product_images/module_icons/craft-details/BLG/curriculum-footprint-blg.png","sub_modules":[{"name":"How to come up with insights","description":"Understand how to prioritise the insights you want to base your brand decisions on"},{"name":"Building a brand wedge","description":"Learn how to craft your brand wedge, which will serve as the single source of truth for your brand footprint"},{"name":"Building your brand footprint","description":"Craft a compelling case for your brand by defining how your brand looks, speaks \u0026 behaves"},{"name":"Applying brand footprint across all touchpoints","description":"Identify the important consumer touchpoints to apply the brand footprint to"}]},{"summary_icon":"https://public-cdn.growthx.club/learning-experience-products/production/crafts/new-blg-landing-page/netflix.png","name":"Netflix's brand strategy","sub_modules":[{"name":"Crafting Netflix’s core value proposition","description":"Learn how an established brand launched as a new category in a new geography. Craft Netf
