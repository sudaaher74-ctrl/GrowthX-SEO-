es/privacy-policy-ca267fe2d0c34527.js" defer=""></script><script src="/_next/static/INVmoaq9o4hDwmlaeGYna/_buildManifest.js" defer=""></script><script src="/_next/static/INVmoaq9o4hDwmlaeGYna/_ssgManifest.js" defer=""></script></head><body><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NVB7SK2" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript><div id="__next"><div class="MuiBox-root mui-1c37u4b"><div class="MuiBox-root mui-1y7wbjf"></div></div><div class="MuiBox-root mui-t0u39z"><main class="MuiBox-root mui-yvg3wp"><div class="MuiBox-root mui-149kwh7"><div class="MuiBox-root mui-kmu09"><span class="MuiCircularProgress-root MuiCircularProgress-indeterminate MuiCircularProgress-colorPrimary mui-1xbt5wt" style="width:40px;height:40px" role="progressbar"><svg class="MuiCircularProgress-svg mui-4ejps8" viewBox="22 22 44 44"><circle class="MuiCircularProgress-circle MuiCircularProgress-circleIndeterminate mui-13odlrs" cx="44" cy="44" r="20.2" fill="none" stroke-width="3.6"></circle></svg></span></div></div><div></div></main></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"metadata":{},"__N_SSG":true,"pageProps":{"content":"# Privacy Policy\n\n**GrowthX Education Labs Private Limited**\n\n**Effective Date:** 11th December 2023.\n\n**Place:** Pune, Maharashtra.\n\n## 1. Information Collection\n\n**a. Personal Information:**\n\nWe collect personally identifiable information (PII), such as names, addresses, phone numbers, date of birth, and government-issued identification, when users register for our educational services. We access certain sensitive information, such as calendar data, only with users’ consent from their Google Accounts. Creating or updating events is strictly limited to notifying members about learning activities, including live sessions and webinars.\n\n**b. Device and Usage Information:**\n\nWe automatically gather detailed information about devices and user interactions. This includes IP addresses, device models, operating systems, browser types, session duration, and pages viewed.\n\n**c. Cookies and Tracking Technologies:**\n\nOur platform employs cookies, beacons, and similar technologies to track user behavior, preferences, and enhance user experience. Users can manage preferences through our dedicated privacy settings.\n\n## 2. Information Use\n\n**a. Service Personalization:**\n\nCollected data is utilized to personalize user experiences, provide tailored educational content, and recommend courses based on individual preferences and learning patterns. The information collected, such as email and name, is primarily used for signing up or signing in users on our platform via Google Auth, enhancing the onboarding experience.\n\n**b. Communication:**\n\nUsers may receive targeted communications, including but not limited to course recommendations, updates, and promotional materials. Opt-out preferences can be managed by adjusting communication settings.\n\n## 3. Information Sharing\n\n**a. Third-Party Collaborations:**\n\nWe may share data with carefully selected third-party educational partners, solely for the purpose of enhancing the user learning experience. These collaborations adhere to strict confidentiality and data protection standards. We do not share the information collected from Google Auth with any third-party service providers; it is purely used to onboard users faster on the platform.\n\n**b. Legal Compliance and Protection:**\n\nUser information may be disclosed to comply with applicable laws, regulations, or legal processes. We may also disclose information to protect against fraud, enforce our terms of service, or safeguard the rights and safety of our users.\n\n## 4. Data Security Protocols\n\nWe employ robust security measures, including encryption, access controls, and regular security audits, to protect user information from unauthorized access, disclosure, alteration, and destruction. All the information we collect from Google Auth, such as the email id and the name, is securely encrypted and stored in our databases.\n\n## 5. User Rights\n\n**a. Access and Correction:**\n\nUsers have the right to access, review, and correct their personal information. Requests for such actions can be submitted through our designated user portal or by contacting our privacy team at hello@growthx.club.\n\n**b. Data Deletion:**\n\nUsers can request the deletion of their personal information. However, certain data may be retained for IP protection / legal / regulatory compliance purposes. Deletion requests can be submitted through our apply@growthx.club.\n\n## 6. Changes to Privacy Policy\n\n**a. Notification Process**\n\nUsers will be informed of any substantial changes to the privacy policy through prominent notices on our platform or direct communication channels. Continued use of our services constitutes acceptance of the updated policy.\n\n## 7. Contact Information\n\nFor questions, concerns, access requests, or data deletion requests related to this privacy policy, users can contact our dedicated privacy team at apply@growthx.club.\n"}},"page":"/privacy-policy","query":{},"buildId":"INVmoaq9o4hDwmlaeGYna","isFallback":false,"gsp":true,"appGip":true,"scriptLoader":[]}</script></body></html>
