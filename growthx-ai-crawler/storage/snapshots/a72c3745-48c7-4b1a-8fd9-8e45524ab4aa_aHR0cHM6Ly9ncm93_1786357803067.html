stry":"Business Consulting and Services","function":"Growth","domain":[],"current":false,"attachments":[],"_id":"69b5ee52f154cb7acf9c80c9"},{"company":"652ce422ea3a178e16ad342b","role":"Vocational trainee","start_date":"2014-05-31T18:30:00.000Z","end_date":"2014-07-30T18:30:00.000Z","industry":"Automotive","sub_industry":"Automobile","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69b5ee52f154cb7acf9c80ca"},{"company":"6530235fce90c1c17d8bf87d","role":"Vocational trainee","start_date":"2013-11-30T18:30:00.000Z","end_date":"2014-01-30T18:30:00.000Z","industry":"Energy","sub_industry":"Electricity","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69b5ee52f154cb7acf9c80cb"},{"company":"682a31b2d431ae7a0d8380e2","role":"Vocational trainee","start_date":"2013-05-31T18:30:00.000Z","end_date":"2013-07-30T18:30:00.000Z","industry":"Business Supplies and Equipment","sub_industry":"Industrial and Manufacturing Supplies","function":"Engineering","domain":[],"current":false,"attachments":[],"_id":"69b5ee52f154cb7acf9c80cc"}],"social":{"linkedin":"https://www.linkedin.com/in/singhal-sumit","twitter":"","website":""},"display_picture":"https://du2l2d5icvsbf.cloudfront.net/USER/sumit_singhal_b58b2565d6/PROFILE_PHOTO/59aeb359c2-sumit_singhal_b58b2565d6.jpeg"},"editor_data":{"_id":"66cf4e4a2a653dc009595d59","identifier":"engagement-\u0026-retention-project--|--lending-stream-66cf4e4a2a653dc009595d59","name":"Engagement \u0026 Retention project  |  Lending Stream","type":"PROOF_OF_WORK","path":[{"name":"Engagement \u0026 Retention","url":"/projects/64e61fea67ef9e05ef26a40f","_id":"66cf4e4a2a653dc009595d5b"}],"visibility":"PUBLIC","banner":"https://du2l2d5icvsbf.cloudfront.net/editor/banner-3.webp","owner":"66acb05c56805a1b4215f176","access":{"66acb05c56805a1b4215f176":"VIEW","64eda27f2df2e0b2da9c1e9b":"EDIT","65cc9ae6a2e362863c5b395a":"EDIT","64424e0740ee3b3358e7988a":"EDIT"},"created_at":"2024-08-28T16:20:26.875Z","updated_at":"2025-06-24T06:52:39.737Z","__v":0,"data":{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Lending Stream - An Overview","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Lending Stream is an online short term loan product designed specifically for Brits with less than perfect credit score (low credit worthiness). It is mainly a 6 month loan with some users eligible for a 12 month loan term too. ","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"A user needs to apply for it on our website by filling up a quick online form. Once its submitted, we run our underwriting and affordability assessment to decide whether or not to lend money, which takes about 5 seconds on average. If the application is approved, the user needs to add a bit more information and review the loan agreement after which the money is transferred to their bank account within 90 seconds.","type":"text","version":1}],"direction":"ltr","format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Lending Stream's value proposition, at a very high level, is their ability to offer short term loans to users who otherwise would find it difficult to borrow from banks and other financial institutions, while keeping them away from getting into debt-trap and doing all of this in a couple of minutes. Lending Stream is regulated and authorised by Financial Conduct Authority (FCA).","type":"text","version":1}],"direction":"ltr","format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Let's understand Lending Stream as a product in more detail💡","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h1"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Problem that it solves:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h3"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Its a short term loan product designed mainly to lend small sum of money to people with bad credit history, who find it hard to get it elsewhere quickly. Some good/fair credit people also borrow from us when they need the cash urgently and have nowhere else to go.  ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"People refer to such loans as Payday Loans (an older term which isn't right in the current context), Short term loans and bad credit loans. These products are regulated by the Financial Conducts Authority (FCA) under High Cost Short Term Credit (HCSTC) category. These customers are majorly categorised by their credit worthiness and their bankability - near sub-prime and non-prime.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Basic features:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h3"},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Fully online product where-in you apply online through our website that takes a few minutes.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Instant credit decision (a few seconds) and Superfast payout (within 90 seconds).","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Clear loan terms - daily interest rates and late fees.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Easy EMI repayments over 6/12 months.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":4},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Option to borrow multiple times (2 loans max at the same time).","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":5},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Very expensive form of borrowing.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":6},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Available only for UK residents who are 18+, employed and have bank account \u0026 a debit card.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":7}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Other ways to solve the problem that it solves:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h3"},{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Check if the expense can be deferred","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" - Absolutely best way but in most cases, it is not feasible.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Asking for money from Friends and family ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"- Usually the best solution if you have the luxury. Some of our customers have stated that they feel bad asking for help from FnF as it exposes their financial vulnerabilty.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Claim any state benefits or grants that you're entitled to","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" - A lot of folks don't know about their entitlements and there are no easy ways to find all but this can prove really helpful as it basically is free money. however, getting these even if you're entitled can take time which is when they go for loans.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Mainstream products like bank loans, credit cards, credit unions, bank overdrafts, guarantor loans, secure loans, pawn brokers, etc.","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" - Although these could take some time to get, it is a sustainable way of borrowing as the interest rates are usually lower here. However, most of our target audience don't get served by them.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":4},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Our competitor products like Moneyboat, Cashfloat. etc.","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" - Most of our competitors charge the same interest rate making them almost as good as our loan however, there are products in the market that are cheaper than ours. It all comes down to the customers' creditworthiness. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":5},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Unauthorised and Illegal money lenders","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" - This can prove detrimental as some illegal money lenders go beyond what is permissible by the FCA to collect dues. This is not a recommended route but unserved by the regulated lenders, people go to these illegal lenders too.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":6}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Product Stage","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h3"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"PMF achieved many years ago. Undergoing mature scaling now. Leader in the market (\u003e30% market share of HCSTC in the UK).","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Now that we understand the product really well, let's design our ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"color: #826EFF;","text":"Engagement Strategy:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h3"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"STEP 1 → Product","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"color: #826EFF;","text":"1. What is the core value prop of your product? How do users currently experience that core value prop repeatedly?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":"color: #826EFF;"},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Our Core Value Proposition is to \"Solve urgent cash needs for UK residents by lending them smaller sum of money in minutes, especially when their credit history isn't perfect\".","type":"text","version":1},{"type":"linebreak","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Users experience this core value proposition by getting the cash that they need after getting onboarded as a new customer and then use their good repayment behaviour to keep borrowing from us whenever there is a need (as long as we feel they can afford these loans).","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"They can take the repeat loans by logging into their LS account and applying from there. They'd be able to apply for another loan only if they have shown positive repayment behaviour in their last loan(s). They can hold 2 loans parallely at a time with us.","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"They can make the repayments using Auto Debit feature OR manually by loggin into their account.","type":"text","version":1},{"type":"linebreak","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":2}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"color: #826EFF;","text":"2. What is the natural frequency of your product?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":"color: #826EFF;"},{"children":[{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Casual User:","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" 1-2 loans in the a 2 year window","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Core User: ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"3-5 loans in the a 2 year window ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Power User: ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"5+ loans in the a 2 year window","type":"text","version":1},{"type":"linebreak","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"bullet","start":1,"tag":"ul"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"color: #826EFF;","text":"3. Do you have other sub products? What is their natural frequency like?","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #F2F2F2;","text":"No, there is only one product that is the loan product, however, a key feature of a loan product (also a core action) is making repayments which in almost all cases is paid once a month as long as there is an active loan.","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"color: #826EFF;","text":"4. What is the best engagement framework for your product?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":1,"textStyle":"color: #826EFF;"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"children":[{"children":[{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Engagement Framework","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":114},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Relevance","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":96},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Key Metric to be tracked","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":50},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Rationale","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":736}],"format":"","indent":0,"type":"tablerow","version":1},{"children":[{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Frequency","type":"text","version":1}],"direction":"ltr","format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":114},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Primary","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":96},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"X loans over Y months","type":"text","version":1}],"direction":"ltr","format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":50},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"We'd want our users to borrow from us as many times as they need. This will help them realise the CVP of our product by paying off an emergency bill whenever that occurs regardless of amount. More loans == more no. of times that customers realised CVP == Higher brand consideration == Longer term retention == High LTV.","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"You must now be thinking, why not optimize for the actual amount they borrow as higher loan amount == higher profits ..., You're right but there's a catch. Read the next section to understand.","type":"text","version":1}],"direction":"ltr","format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":736}],"format":"","indent":0,"type":"tablerow","version":1},{"children":[{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Depth","type":"text","version":1}],"direction":"ltr","format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":114},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Secondary","type":"text","version":1}],"direction":"ltr","format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":96},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"£X over Y months","type":"text","version":1}],"direction":"ltr","format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":50},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Our customers don't control the amount that they're approved for and can only control how much out of the approved amount, do they borrow. In most cases, our customers take out the entire approved amount leaving lesser scope to increase the average loan size. Having said that, we should make UX optimizations to increase the {approved amount} to {funded amount} ratio to increase the LTV.","type":"text","version":1}],"direction":"ltr","format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":736}],"format":"","indent":0,"type":"tablerow","version":1},{"children":[{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Breadth","type":"text","version":1}],"direction":"ltr","format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":114},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Nill","type":"text","version":1}],"direction":"ltr","format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":96},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"-","type":"text","version":1}],"format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":50},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"We offer only 1 product i.e. a loan. There are no other products/sub-products/features that would help the customers realise more value proposition.","type":"text","version":1}],"direction":"ltr","format":"start","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"format":"","indent":0,"type":"tablecell","version":1,"colSpan":1,"headerState":0,"rowSpan":1,"width":736}],"format":"","indent":0,"type":"tablerow","version":1}],"format":"","indent":0,"type":"table","version":1}],"format":"","indent":0,"type":"gx-table-container","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Step 2 → Define who is an ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #826EFF;","text":"active user","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" of our product","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"For our loan product, users get activated when they borrow (and successfully close) X loans in the first Y months. However, a user once activated can become dormant and even churn. ","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"So, a good way to define active users would be to look at:","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"how recently did they borrow","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"how frequently did they borrow","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Now, customers might not be able to borrow until they're deemed affordable by our underwriting but they could still be active on our the product by making repayments for the open loans, therefore it would be less appropriate to look at \"time since their last loan\" to call them active.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Instead, the appropriate definition for an active user could be:","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"\"","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"color: #FF6F31;","text":"A user having a non-zero outstanding balance over the last 12 months and haven't gone bad (default, chargeback, etc.)","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"\" ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":"color: #FF6F31;"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"We decided on 12 months in the above statement based on the natural frequency of our users.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Step 3 → Customer Segmentation","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Before, we get into our segmentation, let's first understand our users. And the most efficient way to do that is by tabulati pe":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Reward good repayment behaviour - ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"Design a program to reward users on their good repayment behaviour like closing a loan on/before time. Thus increasing their trust on the brand and hence the engagement. E.g. 10% cashback of your entire interest paid if you close the loan on/before time. Please ensure this doesn't end with us a net LTV loss as closing the loan too soon would mean lower revenue.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":2},{"children":[{"detail":0,"format":1,"mode":"normal","style":"","text":"Add new features/subproduct -","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":" Add a subproduct or feature that would add more value to the user only they are your active users (you can decide to open it for all too). E.g. Partner with a discount coupon merchant to let them use the discount coupons that are not available to public. For this, they need to use some coins that they earn when they borrow/make timely repayments, etc.  ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":3}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"And that'a wrap for our Engagement strategy.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Retention Design","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h1"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Step 1 → Understand our retention","type":"text","version":1},{"detail":0,"format":2,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Since it is a longer term and a lower frequency product, we would need to understand the retention for our product by looking at how many customers are still active after say every 6 months. ","type":"text","version":1},{"type":"linebreak","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"As defined earlier, ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"color: #FF6F31;","text":"A user having a non-zero outstanding balance over the last 12 months and haven't gone bad (default, chargeback, etc.) is an active user ","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"color: #F2F2F2;","text":"of our product.","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"So, if a good-standing user had at least one day when the outstanding principal balance was \u003e0 during the last 12 months after the X months of acquisition, the user would be termed as a retained user for MX.","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"* Good-standing user - A user who has not defaulted on the loan or showed any signs of other bad behaviour. If a users misses payment but gets back on the track before the loan schedule, we could consider him/her good-standing. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":"color: #FF6F31;"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"color: #FF6F31;","text":"Bird's-eye view","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":1,"textStyle":"color: #FF6F31;"},{"children":[{"detail":0,"format":1,"mode":"normal","style":"color: #826EFF;","text":"1. What is your current retention rate in terms of users? ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":1,"textStyle":"color: #826EFF;"},{"children":[{"children":[{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"MAU (monthly active users) - ~2% \u003e\u003e we see about 20K unique users from our 1M user base who borrow in a month.","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"YAU (yearly active users) - ~8% \u003e\u003e We see about 80K unique users out of our 1M user base who borrow in a year.","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":2}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"These metrics are low as we've had this product for over 15 years and a lot of our older customers are no-longer our target customers plus there have been instances of poor product experiences in the past leading to even lower retention from those customers. Another reason is regulatory requirements to not lend customers more than a certain times over a stipulated time and also over a lifetime.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"If we were to look at these metrics for recent cohorts, the numbers would be much better.","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"Another interesting thing that you'd see in the above metrics is that the YAU is just 4 times of MAU - which means, there are sets of users who borrow multiple times in a year and sets of users who don't borrow at all (churned). ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"color: #826EFF;","text":"2. At what time period does your retention curve flatten? ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":1,"textStyle":"color: #826EFF;"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Retention curve (i.e. had \u003e0 OPB over the last 12 years of X month from acquisition and are good-standing)","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"* Guesstimate based on looking at similar data for the last few years - never really looked at this data.","type":"text", ext","version":1}],"direction":"ltr","format":"","indent":2,"type":"listitem","version":1,"value":10},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"M108 - 4% and so on...","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://public-cdn.growthx.club/USER/sumit_singhal_b58b2565d6/EDITOR/MEDIA/624cf24ac2-image.png","type":"image","version":1,"width":"inherit"}],"direction":"ltr","format":"","indent":2,"type":"listitem","version":1,"value":11}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"}],"direction":"ltr","format":"","indent":1,"type":"listitem","version":1,"value":1}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"}],"direction":"ltr","format":"","indent":0,"type":"listitem","version":1,"value":1}],"direction":"ltr","format":"","indent":0,"type":"list","version":1,"listType":"number","start":1,"tag":"ol"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"So, based on the above data - the retention curve kind of flattens at about 8-9 years since acquisition. Post that only super loyal users stick. ","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":1,"mode":"normal","style":"color: #FF6F31;","text":"Microscopic View","type":"text","version":1},{"type":"linebreak","version":1},{"type":"linebreak","version":1},{"detail":0,"format":1,"mode":"normal","style":"color: #826EFF;","text":"1. Which ICPs drive the best retention?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":1,"textStyle":"color: #FF6F31;"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Both Chloe (higher use case but Lower loyalty) and David (lower use case but higher loyalty) show similar retention rates. Other minor ICPs also follow a similar pattern. Overall all the 4 ICPs have casual/core/power users who have varied retention rates. ","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1},{"detail":0,"format":1,"mode":"normal","style":"color: #826EFF;","text":"2. Which acquisition channels drive the best retention?","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":"color: #826EFF;"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Partner channels intuitively drive lower retention than non-partner (own marketing) channels in the start as our onw-marketing efforts focus a lot of presenting ourself as a superior product in the market while the partner leads are essentially leads who instead of applying directly with us, applied with lead brokers displaying lower brand loyalty.","type":"text","version":1},{"type":"linebreak","version":1},{"detail":0,"format":0,"mode":"normal","style":"","text":"However, this gap reduces over time and more importantly the average loan size for partners-driven users is higher than own-marketing driven users ultimately making both the channels similar in the longer term.  ","type":"text","version":1}],"direction":"ltr","format":"","indent":1,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Step 2 → Reasons of Churn","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"heading","version":1,"tag":"h2"},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"​","type":"text","version":1}],"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"After speaking to a lot of customers who have churned and are showing signs of churn plus reading through numerous negative reviews on the review sites - I've put together the key reasons of churn and their proposed solutions in the following mind map. Access the ","type":"text","version":1},{"detail":0,"format":0,"mode":"normal","style":"color: #F2F2F2;","text":"whimsical ","type":"text","version":1},{"children":[{"detail":0,"format":0,"mode":"normal","style":"color: #FF6F31;","text":"here","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"link","version":1,"rel":"noreferrer","url":"https://whimsical.com/lending-stream-engagement-campaigns-growthx21-4vsufjV8ms3htAtdVmN9WY@2bsEvpTYSt1HjL5YhaouUdSJVFWX817JFwa"},{"detail":0,"format":0,"mode":"normal","style":"","text":". There are also a couple of involuntary churn reasons (not controlled by users) that we as a business could do something about.","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":"color: #FF6F31;"},{"children":[{"altText":"image.png","caption":{"editorState":{"root":{"format":"","indent":0,"type":"root","version":1}}},"height":"inherit","maxWidth":750,"showCaption":false,"src":"https://public-cdn.growthx.club/USER/sumit_singhal_b58b2565d6/EDITOR/MEDIA/25206df8d1-image.png","type":"image","version":1,"width":"inherit"}],"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":1,"m
