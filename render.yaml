databases:
  - name: growthx-postgres
    databaseName: growthx_crawler
    user: growthx
    plan: free

services:
  - type: redis
    name: growthx-redis
    plan: free
    ipAllowList: []

  - type: web
    name: growthx-crawler-api
    env: docker
    plan: free
    # Tell Render that the backend is inside this folder:
    rootDir: growthx-ai-crawler
    # Look for the Dockerfile (relative to rootDir, so just Dockerfile):
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: growthx-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: growthx-redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NODE_OPTIONS
        value: "--max-old-space-size=300"
      - key: ENABLE_PLAYWRIGHT_STARTUP
        value: "false"
      # Secrets are never checked into the repository.
      #
      # `sync: false` tells Render to prompt for the value in the dashboard and
      # keep it out of this file. ENCRYPTION_KEY must be 64 hex chars
      # (`openssl rand -hex 32`) and must NOT be rotated casually — it decrypts
      # stored customer integration credentials.
      - key: ENCRYPTION_KEY
        sync: false
      # Generated by Render on first deploy; rotate from the dashboard.
      - key: JWT_SECRET
        generateValue: true
      # Sarvam is the platform's primary AI provider, so the API is close to
      # useless without this. Reasoning is left disabled by default: Sarvam
      # charges thinking tokens against the answer's budget, and a request
      # sized for the answer alone comes back empty. See .env.example.
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: sarvam-105b
      # Sarvam's Starter plan caps output at 4096 tokens; raise to your plan's
      # ceiling (Pro 16384 / Business 128000).
      - key: SARVAM_MAX_OUTPUT_TOKENS
        value: "4096"
      # Live web search for Market Research. Without it the tab answers from
      # the client's own crawl only and says so in the answer's evidence gaps;
      # no provider the router speaks to can search the web from a Chat
      # Completions call. Free tier at https://tavily.com.
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Optional AI providers — the multi-AI router degrades gracefully when unset.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Competitor content ingestion. Without it the Cross-Competitor Matrix,
      # Video Intelligence and pattern detection have nothing to read: they
      # report that plainly rather than filling in, so an unset key looks like
      # an empty product. YouTube Data API v3, free tier, 10,000 units/day —
      # a sync costs about 3 units per competitor channel.
      - key: YOUTUBE_API_KEY
        sync: false
      # Comma-separated list of browser origins allowed to call this API.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Comma-separated emails allowed into /api/admin. Unset denies everyone.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: DEFAULT_CRAWL_CONCURRENCY
        value: "3"
      - key: MAX_CRAWL_CONCURRENCY
        value: "3"
      - key: DEFAULT_CRAWL_DEPTH
        value: "5"
      - key: MAX_CRAWL_DEPTH
        value: "20"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
